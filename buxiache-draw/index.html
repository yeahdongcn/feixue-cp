<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0c0a">
<title>画地为牢</title>
<style>
  :root{
    --ink:#f0e8d8; --ink2:#c2b7a2; --dim:#ab9e86;
    --warm:#ffc98a; --warm2:#ff9d5c; --bad:#ff8f78;
    --paper:#0d0c0a;
    --rule:rgba(255,201,138,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);
    font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",STSong,SimSun,serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  button{font-family:inherit}
  #ui{position:fixed;inset:0;pointer-events:none;user-select:none;z-index:2}
  #top,#side,#hint{transition:opacity .35s,visibility .35s}
  body.card-open #top,body.card-open #side,body.card-open #hint,body.card-open #snd{opacity:0;visibility:hidden}
  body.end-open #ui{opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}

  /* ── 左上：年份 ── */
  #top{position:absolute;left:clamp(18px,2.3vw,30px);top:clamp(16px,2.4vh,24px)}
  #year{font-size:17px;letter-spacing:.3em;color:var(--ink);font-variant-numeric:tabular-nums}
  #yearRule{width:26px;height:1px;margin:9px 0 8px;
    background:linear-gradient(90deg,var(--warm),rgba(255,201,138,0));opacity:.9}
  #sub{font-size:13px;letter-spacing:.13em;color:var(--ink2)}

  /* ── 右上：绳 ── */
  #side{position:absolute;right:clamp(18px,2.3vw,30px);top:clamp(16px,2.4vh,24px);text-align:right}
  #ropeLabel{font-size:13px;letter-spacing:.22em;color:var(--ink2)}
  #ropeBar{width:132px;height:3px;background:rgba(255,255,255,.12);margin:9px 0 7px auto;
    position:relative;overflow:hidden;border-radius:2px}
  #ropeBar i{position:absolute;left:0;top:0;bottom:0;width:100%;
    background:linear-gradient(90deg,rgba(255,157,92,.85),var(--warm));transition:width .08s linear}
  #ropeBar.low i{background:linear-gradient(90deg,#ff5c48,var(--bad))}
  #ropeNum{font-size:13px;letter-spacing:.05em;color:var(--warm);
    font-variant-numeric:tabular-nums;transition:color .2s}
  #ropeNum b{font-weight:400}
  #ropeNum i{font-style:normal;color:var(--dim);margin-left:4px;letter-spacing:.02em}
  #ropeNum.low{color:var(--bad)}
  #ropeNum.low i{color:rgba(255,143,120,.72)}
  #needLine{font-size:13px;letter-spacing:.07em;color:var(--ink2);margin-top:11px;
    font-variant-numeric:tabular-nums;transition:color .2s}
  #needLine b{color:var(--warm);font-weight:400}
  #needLine.ok{color:var(--warm)}

  /* ── 底部 ── */
  #hint{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:13px;
    letter-spacing:.11em;color:var(--ink2);opacity:.92;transition:opacity .45s,transform .45s}
  #hint.gone{opacity:0;transform:translateY(5px)}
  #snd{position:absolute;right:clamp(18px,2.3vw,30px);bottom:24px;font-size:13px;
    letter-spacing:.1em;color:var(--ink2);background:#14110e;
    border:1px solid rgba(255,220,180,.16);border-radius:2px;padding:0 12px;
    min-height:44px;display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;pointer-events:auto;transition:border-color .25s,color .25s,opacity .35s,visibility .35s}
  #snd:hover{border-color:rgba(255,201,138,.5);color:var(--warm)}
  #snd.off{color:var(--dim)}

  /* ── 提示条：固定贴在底部提示行上方，永远不压物件 / 圈 ── */
  #toast{position:absolute;left:0;right:0;bottom:84px;text-align:center;
    font-size:16px;letter-spacing:.18em;color:var(--warm);opacity:0;transition:opacity .22s;
    text-shadow:0 0 30px rgba(255,170,90,.55)}
  #toast.on{opacity:1}
  #toast.bad{color:var(--bad);text-shadow:0 0 30px rgba(255,90,60,.5)}

  /* ── 章节卡 ── */
  #card{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(74% 74% at 50% 46%,rgba(12,9,7,.2),rgba(5,5,4,.04) 62%,rgba(0,0,0,0));
    backdrop-filter:blur(2.5px);opacity:0;pointer-events:none;transition:opacity .5s}
  #card.on{opacity:1;pointer-events:auto}
  #card::before,#card::after{content:'';position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}
  #card::before{width:min(78vh,620px);height:min(78vh,620px);
    border:1px solid rgba(255,201,138,.12);
    box-shadow:inset 0 0 110px rgba(255,170,90,.035)}
  #card::after{width:min(68vh,540px);height:min(68vh,540px);
    border:1px dashed rgba(255,201,138,.075)}
  #card .in{position:relative;z-index:1;text-align:center;max-width:560px;overflow:hidden;
    padding:34px clamp(26px,3.6vw,46px) 30px;
    background:linear-gradient(180deg,rgba(47,37,27,.94),rgba(36,29,21,.96));
    border:1px solid rgba(255,201,138,.18);
    box-shadow:0 30px 80px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,225,190,.06);
    animation:cardIn .55s ease-out both}
  #card .in::before{content:'';position:absolute;left:18%;right:18%;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,201,138,.5),transparent)}
  @keyframes cardIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  #card .y{font-size:13px;letter-spacing:.44em;color:#ffd9ab}
  #card .t{font-size:clamp(27px,5.6vw,38px);letter-spacing:.16em;margin:16px 0 18px;
    color:var(--ink);font-weight:400;text-shadow:0 0 46px rgba(255,180,110,.12)}
  #card .l{font-size:15px;line-height:2.05;color:var(--ink2);letter-spacing:.04em}
  #card .meta{font-size:13px;letter-spacing:.12em;color:var(--ink2);margin-top:18px}
  #card .meta b{color:var(--warm);font-weight:400}
  #card .dots{display:flex;gap:9px;justify-content:center;margin-top:20px}
  #card .dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,201,138,.2)}
  #card .dots i.on{background:var(--warm);box-shadow:0 0 9px rgba(255,201,138,.8)}
  #card .go{margin-top:25px;font-size:13px;letter-spacing:.24em;color:var(--ink2);
    animation:breathe 2.6s infinite}
  @keyframes breathe{0%,100%{opacity:.34}50%{opacity:.92}}

  /* ── 结算 / 分享卡 ── */
  #end{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;
    padding:20px;overflow-y:auto;overscroll-behavior:contain;
    background:radial-gradient(62% 62% at 50% 42%,rgba(32,23,15,.6),rgba(5,5,5,.9) 76%);
    backdrop-filter:blur(9px);opacity:0;pointer-events:none;transition:opacity .7s}
  #end.on{opacity:1;pointer-events:auto}
  #shareCard{position:relative;width:min(720px,calc(100vw - 40px));margin:auto;
    max-height:calc(100vh - 40px);overflow:hidden;
    padding:clamp(20px,2.5vw,32px) clamp(20px,3.2vw,40px) clamp(16px,2vw,24px);
    background:radial-gradient(120% 100% at 108% 116%,rgba(255,166,86,.075),rgba(255,166,86,0) 58%),
      linear-gradient(180deg,#2f261c 0%,#292219 56%,#231d15 100%);
    border:1px solid rgba(255,201,138,.22);
    box-shadow:0 40px 100px rgba(0,0,0,.66),inset 0 1px 0 rgba(255,225,190,.07)}
  #shareCard::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,201,138,.6),transparent)}
  .scHead{display:flex;justify-content:space-between;align-items:baseline;
    font-size:13px;letter-spacing:.26em;color:var(--dim)}
  .scTitle{font-size:clamp(30px,4.2vw,44px);letter-spacing:.2em;margin:9px 0 7px;
    font-weight:400;color:#f7f0e2;line-height:1.4}
  .scSub{font-size:13px;letter-spacing:.13em;color:#ffd9ab;margin-bottom:15px}
  .scScore{display:flex;align-items:flex-end;gap:9px;padding-bottom:13px;margin-bottom:14px;
    border-bottom:1px solid rgba(255,201,138,.14)}
  .scScore .num{font-size:clamp(40px,5.6vw,60px);line-height:1.45;color:#ffd9ab;
    font-variant-numeric:tabular-nums}
  .scScore .lab{font-size:13px;color:var(--ink2);letter-spacing:.08em;padding-bottom:5px}
  .scScore .of{margin-left:auto;font-size:13px;color:var(--dim);letter-spacing:.08em;padding-bottom:6px}
  .scYears{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;
    background:rgba(255,201,138,.11);border:1px solid rgba(255,201,138,.11)}
  .cell{background:#241d15;padding:8px 9px 7px}
  .cell .cy{display:block;font-size:13px;color:var(--ink2);letter-spacing:.04em}
  .cell b{display:block;font-size:19px;font-weight:400;color:var(--warm);line-height:1.25;margin-top:2px}
  .cell i{font-style:normal;font-size:13px;color:var(--dim)}
  .cell.zero b{color:var(--dim)}
  .scLine{font-size:15px;line-height:1.9;color:var(--ink2);margin:15px 0 0;letter-spacing:.02em;
    user-select:text;-webkit-user-select:text}
  .scLine b{color:var(--warm);font-weight:400}
  .scActions{display:flex;gap:10px;margin-top:17px}
  #btnAgain{flex:1;background:#f2c78f;border:1px solid #f2c78f;color:#1a1209;
    font-size:14px;letter-spacing:.2em;padding:12px 16px;cursor:pointer;border-radius:1px;
    transition:background .25s,box-shadow .25s}
  #btnAgain:hover{background:var(--warm);box-shadow:0 0 30px rgba(255,201,138,.22)}
  #btnCopy{flex:1;background:transparent;border:1px solid rgba(255,201,138,.28);color:var(--ink);
    font-size:14px;letter-spacing:.14em;padding:12px 16px;cursor:pointer;border-radius:1px;
    transition:border-color .25s,color .25s}
  #btnCopy:hover{border-color:rgba(255,201,138,.7);color:var(--warm)}
  .scFoot{margin-top:12px;font-size:13px;letter-spacing:.05em;color:var(--dim)}

  @media (max-width:560px){
    #hint{bottom:76px}
    /* 手机上提示行抬到 76px，提示条跟着抬，保持 18px 间距 */
    #toast{bottom:112px}
    #card::before,#card::after{display:none}
    #card .in{width:calc(100vw - 40px);padding:24px 22px 22px}
    #card .t{font-size:28px;margin:14px 0 16px}
    #card .l{font-size:14px;line-height:1.95}
    #end{padding:12px}
    #shareCard{width:calc(100vw - 24px);max-height:calc(100vh - 24px);
      padding:18px 16px 15px}
    .scTitle{font-size:32px;margin:8px 0 6px}
    .scScore{gap:7px;padding-bottom:11px;margin-bottom:12px}
    .scScore .num{font-size:42px}
    .scScore .of{font-size:13px}
    .scYears{grid-template-columns:repeat(3,1fr)}
    .cell{padding:6px 8px 5px}
    .scLine{font-size:14px;line-height:1.85;margin-top:13px}
    .scActions{margin-top:14px;gap:8px}
    #btnAgain,#btnCopy{font-size:14px;padding:11px 10px;letter-spacing:.12em;min-height:46px}
    .scFoot{margin-top:10px;font-size:13px}
  }

  /* 小屏（≤360 宽）：压紧结算卡，避免尾注被裁 */
  @media (max-width:360px){
    #end{padding:10px}
    #shareCard{width:calc(100vw - 16px);max-height:none;padding:16px 13px 12px}
    .scTitle{font-size:28px;margin:6px 0 5px}
    .scScore{gap:6px;padding-bottom:9px;margin-bottom:10px}
    .scScore .num{font-size:36px}
    .cell{padding:4px 6px 3px}
    .cell b{font-size:19px;margin-top:1px}
    .scLine{font-size:13px;line-height:1.7;margin-top:10px}
    .scActions{margin-top:10px}
    .scFoot{margin-top:8px}
  }

  /* 矮屏（≤520 高，典型是手机横屏）：整张卡压进一屏，放不下时 #end 可滚动 */
  @media (max-height:520px){
    #end{padding:8px}
    #shareCard{width:min(720px,calc(100vw - 16px));max-height:none;padding:12px 20px 10px}
    .scTitle{font-size:26px;line-height:1.3;margin:4px 0 2px}
    .scSub{margin-bottom:8px}
    .scScore{padding-bottom:7px;margin-bottom:8px}
    .scScore .num{font-size:32px;line-height:1.3}
    .scScore .lab{padding-bottom:3px}
    .scScore .of{padding-bottom:4px}
    .scYears{grid-template-columns:repeat(6,1fr)}
    .cell{padding:4px 7px 3px}
    .scLine{font-size:13px;line-height:1.6;margin-top:8px}
    .scActions{margin-top:8px}
    #btnAgain,#btnCopy{padding:11px 12px}
    .scFoot{display:none}
  }
</style>
</head>

</div></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════
   《画地为牢》 v3 · 手上要有分量
   绳长即周长。你圈住什么，就只剩什么。
   ══════════════════════════════════════════════════════════════ */

const LEVELS = JSON.parse(document.getElementById('levels').textContent);
const WORLD = 1000;                 // 世界是边长 1000 的正方形
const MIN_LEN = 130;                // 封口所需最短笔画
const CLOSE_R = 46;                 // 回到起点多少以内算封口
const MIN_AREA = 1500;              // 太扁的圈不算
const MIN_TURN = 2.6;               // 自交封口：至少转过 149°
const TURN_GAP = 5.2;               // 直接回到起点：几乎要绕满一圈

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const els = {
  year:$('year'), sub:$('sub'), ropeBar:$('ropeBar'), ropeFill:$('ropeFill'), ropeNum:$('ropeNum'),
  ropeLeft:$('ropeLeft'), ropeOf:$('ropeOf'),
  need:$('needLine'), hint:$('hint'), toast:$('toast'), snd:$('snd'), top:$('top'), side:$('side'),

/* ══════════════════ 声音：全部现场合成，不加载任何文件 ══════════════════ */
let AC = null, master = null, soundOn = true, noiseBuf = null, lastScratch = 0;

function audioCtx(){
  if (AC) return AC;
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return null;
  try {
    AC = new Ctor();
    master = AC.createGain();
    master.gain.value = 0.62;
    master.connect(AC.destination);
  } catch(_){ AC = null; }
  return AC;
}
function unlockAudio(){
  if (!soundOn) return;
  const a = audioCtx();
  if (a && a.state === 'suspended'){ try { a.resume(); } catch(_){} }
}
function tone(freq, dur, type, gain, delay, slideTo){
  if (!soundOn || !AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain || 0.05), t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function noiseBurst(dur, freq, q, gain, delay, type){
  if (!soundOn || !AC) return;
  try {
    if (!noiseBuf){
      const n = Math.floor(AC.sampleRate * 0.4);
      noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
    }
    const src = AC.createBufferSource(); src.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = type || 'bandpass';
    f.frequency.value = freq; f.Q.value = q || 1;
    const g = AC.createGain();
    const t0 = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(Math.max(0.0002, gain || 0.04), t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur + 0.03);
  } catch(_){}
}
function sfxTick(){ tone(660, .05, 'sine', .022, 0); }
function sfxCard(){ tone(330, .22, 'sine', .028, 0); tone(440, .3, 'sine', .018, .04); }
function sfxScratch(speed){
  const now = Date.now();
  if (now - lastScratch < 62) return;
  lastScratch = now;
  if (speed < .55) return;
  noiseBurst(.035, 1500 + Math.random()*900, 1.8, .012 + Math.min(.016, speed*.004), 0);
}
function sfxSeal(){
  tone(98, .5, 'sine', .16, 0, 74);
  tone(196, .7, 'triangle', .07, .01);
  tone(293.66, .65, 'sine', .045, .045);
  tone(392, .8, 'sine', .038, .09);
  tone(1174.66, .5, 'sine', .022, .13);
  noiseBurst(.22, 2600, .8, .03, 0);
}
function sfxFail(){
  tone(120, .3, 'sawtooth', .055, 0, 62);
  noiseBurst(.2, 320, .7, .075, 0, 'lowpass');
}
function vibrate(p){
  try { if (navigator.vibrate) navigator.vibrate(p); } catch(_){}
}

/* ══════════════════ 视图 ══════════════════
   不再固定把 1000×1000 的盘塞进屏幕：每一关按本关物件的包围盒
   自动缩放、居中，盘面（边框 / 网格）铺到屏幕边缘，物件撑满画面。
   frame  = 屏幕上的纸面（盘面装饰）
   safe   = 真正放物件的地方：让开顶部 HUD 和底部提示行 / 声音按钮 / 提示条
   ════════════════════════════════════════════ */
let view = { s:1, ox:0, oy:0, cx:0, cy:0 };
let frame = { x:0, y:0, w:0, h:0 };
let safe = { x:0, y:0, w:0, h:0 };
let levelCen = { x:500, y:500 };
let ghostPts = [];        // 末章：前五站的旧物件在屏幕上的位置（已排开、不叠字）
let dpr = 1;

function layout(){
  const w = window.innerWidth, h = window.innerHeight;
  const narrow = w <= 560;
  const side = narrow ? 14 : 20;
  frame = { x:side, y:narrow ? 12 : 16, w:w - side*2, h:h - (narrow ? 24 : 32) };

  // 提示条：读真实的提示行 / 声音按钮位置，永远贴在它们上方（不靠魔数）
  let tb = narrow ? 112 : 84;
  if (els.hint.getBoundingClientRect && els.snd.getBoundingClientRect){
    const rh = els.hint.getBoundingClientRect(), rs = els.snd.getBoundingClientRect();
    tb = Math.max(64, Math.round(h - Math.min(rh.top, rs.top) + 16));
  }
  els.toast.style.bottom = tb + 'px';

  // HUD 永远离纸边 14px：不靠 vw 的魔数，否则 560–870px 宽时文字会骑在纸边上
  const hudIn = side + 14;
  els.top.style.left = hudIn + 'px';
  els.side.style.right = hudIn + 'px';
  els.snd.style.right = hudIn + 'px';

  const top = h < 520 ? 84 : 108;          // 顶部 HUD 高度
  const bottom = tb + 46;                  // 提示条 + 一行余量
  // 安全区必须整个落在纸边以内（否则物件圈会压到纸上那道边线）
  const inf = Math.max(narrow ? 12 : 30, frame.x + 6);
  safe = {
    x: inf,
    y: top,
    w: w - inf*2,
    h: Math.max(120, h - top - bottom),
  };
  fitView();
}

/* 本关物件的世界包围盒 */
function levelBox(L){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const o of L.objs){
    x0 = Math.min(x0, o.x); x1 = Math.max(x1, o.x);
    y0 = Math.min(y0, o.y); y1 = Math.max(y1, o.y);
  }
  if (!isFinite(x0)){ x0 = y0 = 460; x1 = y1 = 540; }
  return { x0, y0, x1, y1, w:x1 - x0, h:y1 - y0 };
}

const MIN_SPAN = 360;   // 只剩一个物件时也要留出能画下半径 ~57 的圈

function fitView(){
  const L = LEVELS[G.idx] || LEVELS[0];
  const b = levelBox(L);
  // 物件名与光晕在屏幕上是固定像素，缩放要给它们让出边距
  const padX = Math.min(46, Math.max(24, safe.w * .08));
  const padY = Math.max(26, Math.min(38, safe.h * .07));
  const bw = Math.max(b.w, MIN_SPAN), bh = Math.max(b.h, MIN_SPAN);
  const s = Math.max(.12, Math.min((safe.w - padX*2) / bw, (safe.h - padY*2) / bh));

  levelCen = { x:(b.x0 + b.x1)/2, y:(b.y0 + b.y1)/2 };
  const ox = safe.x + safe.w/2 - levelCen.x*s;
  const oy = safe.y + safe.h/2 - levelCen.y*s;
  view = { s, ox, oy, cx:levelCen.x*s + ox, cy:levelCen.y*s + oy };
  // 物件圈的大小跟着屏幕密度走：密的时候缩小，不然两个圈会叠在一起
  let md = Infinity;
  for (let i = 0; i < L.objs.length; i++) for (let j = i+1; j < L.objs.length; j++){
    const d = Math.hypot(L.objs[i].x - L.objs[j].x, L.objs[i].y - L.objs[j].y) * s;
    if (d < md) md = d;
  }
  G.objR = Math.max(15, Math.min(OBJ_R, md*0.42));
  planGhosts();
}

/* 末章不把旧物件按原坐标甩得到处都是：以“你自己”为圆心重排成一圈淡淡的年轮，
   让开中心、互相推开、夹进安全区——按原坐标直接放大，名字会叠成一团糊字 */
function planGhosts(){
  ghostPts = [];
  if (G.idx !== LEVELS.length - 1) return;
  const f = LEVELS[G.idx].objs[0];
  let src = [];
  G.kept.forEach(k => { if (k.i !== G.idx) src.push(k.o); });
  G.left.forEach(k => { if (k.i !== G.idx) src.push(k.o); });
  if (!src.length) return;
  // 手机上少放一半：26 个圈在 362px 宽里必然挤成一团
  if (safe.w < 520) src = src.filter((_, i) => i % 2 === 0);

  // 先减掉旧物件的平均偏移，云团才会围着“你”而不是偏到一边
  let mx = 0, my = 0;
  src.forEach(o => { mx += o.x - f.x; my += o.y - f.y; });
  mx /= src.length; my /= src.length;
  const rel = src.map(o => ({ o, dx:(o.x - f.x - mx)*view.s, dy:(o.y - f.y - my)*view.s }));
  const maxdx = Math.max(...rel.map(r => Math.abs(r.dx))) || 1;
  const maxdy = Math.max(...rel.map(r => Math.abs(r.dy))) || 1;
  const ax = Math.max(80, safe.w/2 - 38), ay = Math.max(80, safe.h/2 - 38);
  const k = Math.min(.64, ax/maxdx, ay/maxdy);

  let pts = rel.map(r => ({ o:r.o, x:view.cx + r.dx*k, y:view.cy + r.dy*k }));
  // 中心留白：不让旧物件压住“你自己”和它的名字
  const voidR = Math.min(104, Math.max(70, Math.min(ax, ay)*.42));
  pts = pts.filter(q => Math.hypot(q.x - view.cx, q.y - view.cy) > voidR);

  const gap = 60;
  for (let it = 0; it < 40; it++){
    let moved = 0;
    for (let i = 0; i < pts.length; i++) for (let j = i+1; j < pts.length; j++){
      const a = pts[i], b = pts[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || .01;
      if (d < gap){
        const push = (gap - d) * .28;
        dx /= d; dy /= d;
        a.x -= dx*push; a.y -= dy*push;
        b.x += dx*push; b.y += dy*push;
        moved++;
      }
    }
    // 每一轮都夹回安全区，否则被墙推回来的点会排成一列
    for (const q of pts){
      q.x = Math.max(safe.x + 30, Math.min(safe.x + safe.w - 30, q.x));
      q.y = Math.max(safe.y + 30, Math.min(safe.y + safe.h - 30, q.y));
    }
    if (!moved) break;
  }
  ghostPts = pts;
}

function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  cv.style.width = w+'px'; cv.style.height = h+'px';
  layout();
  seedMotes(w, h);
}
window.addEventListener('resize', resize);

function toWorld(cx, cy){ return { x:(cx - view.ox)/view.s, y:(cy - view.oy)/view.s }; }
function toScreen(p){ return { x:p.x*view.s + view.ox, y:p.y*view.s + view.oy, w:p.w || 1 }; }

/* ══════════════════ 状态 ══════════════════ */
const G = {
  state:'card',           // card | play | sealed | end
  idx:0, rope:0, ropeFull:0,
  path:[], drawing:false, len:0, turn:0, over:false,
  area:0, inside:[], sealedAt:0, toastT:0, failId:0,
  kept:[], left:[], t:0, sealPulse:0,
  // 手感 / 表现
  nearStart:false, lastMove:0, lastEmit:0, speed:0, needAt:0,
  sealT:0, failT:0, dim:0, flash:0, flashBad:false, flashX:0, flashY:0,
  shake:0, particles:[], ripples:[], motes:[],
  hover:{x:0, y:0, on:false},
};

/* ══════════════════ 几何 ══════════════════ */
function segHit(p1,p2,p3,p4){
  const d = (p2.x-p1.x)*(p4.y-p3.y) - (p2.y-p1.y)*(p4.x-p3.x);
  if (Math.abs(d) < 1e-9) return -1;
  const t = ((p3.x-p1.x)*(p4.y-p3.y) - (p3.y-p1.y)*(p4.x-p3.x)) / d;
  const u = ((p3.x-p1.x)*(p2.y-p1.y) - (p3.y-p1.y)*(p2.x-p1.x)) / d;
  if (t > 0.03 && t < 0.97 && u > 0.03 && u < 0.97) return t;
  return -1;
}
function polyLen(p){
  let L = 0;
  for (let i=1;i<p.length;i++) L += Math.hypot(p[i].x-p[i-1].x, p[i].y-p[i-1].y);
  return L;
}
function polyArea(p){
  let a = 0;
  for (let i=0,n=p.length;i<n;i++){
    const q = p[(i+1)%n];
    a += p[i].x*q.y - q.x*p[i].y;
  }
  return Math.abs(a)/2;
}
function inPoly(pt, poly){
  let c = false;
  for (let i=0,j=poly.length-1;i<poly.length;j=i++){
    const a = poly[i], b = poly[j];
    if (((a.y>pt.y) !== (b.y>pt.y)) &&
        (pt.x < (b.x-a.x)*(pt.y-a.y)/(b.y-a.y)+a.x)) c = !c;
  }
  return c;
}

/* ══════════════════ 种子随机：背景纹理每次一致 ══════════════════ */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(0x9e3779b9);
const DUST = [];
for (let i=0;i<40;i++){
  DUST.push({ x:rand(), y:rand(), r:.5+rand()*1.3, a:.05+rand()*.14,
              ph:rand()*6.283, sp:.12+rand()*.3, sw:.4+rand()*1.2 });
}
function seedMotes(w, h){
  G.motes = DUST.map(m => ({
    x: m.x*w, y: m.y*h, r: m.r, a: m.a, ph: m.ph, sp: m.sp, sw: m.sw,
  }));
}

/* ══════════════════ 关卡 ══════════════════ */
function loadLevel(i){
  G.idx = i;
  const L = LEVELS[i];
  G.ropeFull = L.rope; G.rope = L.rope;
  G.path = []; G.drawing = false; G.len = 0; G.turn = 0; G.over = false;
  G.area = 0; G.inside = []; G.sealedAt = 0; G.sealPulse = 0;
  G.sealT = 0; G.failT = 0; G.dim = 0; G.flash = 0; G.shake = 0;
  G.nearStart = false; G.speed = 0;
  G.particles.length = 0; G.ripples.length = 0;
  G.toastT = 0; els.toast.classList.remove('on'); els.toast.classList.remove('bad');
  els.year.textContent = L.year;
  els.sub.textContent = `第 ${i+1} 站 / ${LEVELS.length}`;
  G.needAt = 0;
  syncNeed();
  els.hint.classList.remove('gone');
  syncHud();
  fitView();
}
function syncHud(){
  const k = Math.max(0, G.rope/G.ropeFull);
  els.ropeFill.style.width = (k*100).toFixed(1)+'%';
  els.ropeLeft.textContent = Math.max(0, Math.round(G.rope));
  els.ropeOf.textContent = '/ ' + G.ropeFull;
  const low = k < 0.22;
  els.ropeBar.classList.toggle('low', low);
  els.ropeNum.classList.toggle('low', low);
}

/* 右上角只放一份要求：画的时候是实时还差几样，封口后变成这一笔的账 */
function insideCount(poly){
  const L = LEVELS[G.idx];
  if (!poly || poly.length < 3) return 0;
  let n = 0;
  for (const o of L.objs) if (inPoly(o, poly)) n++;
  return n;
}
function syncNeed(){
  const L = LEVELS[G.idx];
  if (!L) return;
  if (G.state === 'sealed'){
    els.need.classList.add('ok');
    els.need.innerHTML = `圈住 <b>${G.inside.length}</b> · 放手 ${L.objs.length - G.inside.length}`;
    return;
  }
  els.need.classList.remove('ok');
  if (G.drawing && G.path.length > 5 && G.len > 90){
    const d = L.need - insideCount(G.path);
    if (d <= 0){ els.need.classList.add('ok'); els.need.innerHTML = '够了 · 松手封口'; }
    else els.need.innerHTML = `还差 <b>${d}</b> 样`;
  } else {
    els.need.innerHTML = `还需圈住 <b>${L.need}</b> 样`;
  }
}

/* ══════════════════ 粒子 / 波 ══════════════════ */
function addParticle(x,y,vx,vy,life,r,col,g){
  if (G.particles.length > 320) return;
  G.particles.push({x,y,vx,vy,life,max:life,r,col:col||'#ffcf9a',g:g||0,a:.9});
}
function burstSeam(sx,sy){
  for (let i=0;i<34;i++){
    const a = Math.random()*Math.PI*2, sp = 24 + Math.random()*150;
    addParticle(sx, sy, Math.cos(a)*sp, Math.sin(a)*sp - 24, .45+Math.random()*.8,
                1+Math.random()*2.1, Math.random()<.25 ? '#fff3dd' : '#ffb46b', 90);
  }
  for (let i=0;i<9;i++){
    addParticle(sx + (Math.random()-.5)*14, sy + (Math.random()-.5)*14,
                (Math.random()-.5)*12, -12-Math.random()*26, .9+Math.random()*1.1,
                .9+Math.random()*1.4, '#ffd7a4', -6);
  }
}
function burstKeep(sx,sy){
  for (let i=0;i<7;i++){
    const a = -Math.PI/2 + (Math.random()-.5)*2.2, sp = 20 + Math.random()*44;
    addParticle(sx, sy, Math.cos(a)*sp, Math.sin(a)*sp, .5+Math.random()*.6,
                1+Math.random()*1.3, '#ffd9a8', 26);
  }
}
function updateFx(dt){
  for (let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i];
    p.life -= dt;
    if (p.life <= 0){ G.particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += p.g*dt;
    p.vx *= (1 - 1.1*dt);
  }
  for (let i=G.ripples.length-1;i>=0;i--){
    const r = G.ripples[i]; r.life -= dt;
    if (r.life <= 0) G.ripples.splice(i,1);
  }
}

/* ══════════════════ 作画 ══════════════════ */
function startStroke(x, y){
  if (G.state !== 'play' || G.toastT > 0) return;
  unlockAudio();
  const p = toWorld(x, y);
  G.path = [{x:p.x, y:p.y, w:.55}];
  G.drawing = true; G.over = false; G.len = 0; G.turn = 0;
  G.rope = G.ropeFull; G.area = 0; G.inside = [];
  G.nearStart = false; G.lastMove = Date.now(); G.lastEmit = G.t; G.needAt = 0;
  els.hint.classList.add('gone');
  syncHud();
  syncNeed();
  sfxTick();
}
function moveStroke(x, y){
  if (!G.drawing || G.state !== 'play') return;
  const p = toWorld(x, y);
  const last = G.path[G.path.length-1];
  const d = Math.hypot(p.x-last.x, p.y-last.y);
  if (d < 2.2) return;
  if (G.rope - d < 0){
    G.rope = 0; syncHud();
    fail('绳子不够了');
    return;
  }
  // 笔压：走得越快，线越细；慢下来就压出墨
  const now = Date.now();
  const ms = Math.max(6, now - (G.lastMove || now));
  G.lastMove = now;
  const speed = d / ms;
  G.speed = speed;
  const w = Math.max(.62, Math.min(1.32, 1.36 - speed*.14));

  if (G.path.length >= 2){
    const a0 = G.path[G.path.length-2], b0 = last;
    const v1x = b0.x-a0.x, v1y = b0.y-a0.y, v2x = p.x-b0.x, v2y = p.y-b0.y;
    G.turn += Math.atan2(v1x*v2y - v1y*v2x, v1x*v2x + v1y*v2y);
  }

  G.rope -= d; G.len += d;
  G.path.push({x:p.x, y:p.y, w});
  G.nearStart = Math.hypot(p.x-G.path[0].x, p.y-G.path[0].y) < 74
                && G.len > MIN_LEN && Math.abs(G.turn) > 1.2;
  // 实时数一数“这一笔画到现在圈住了几样”，右上角只报还差多少
  if (G.len - G.needAt > 18){ G.needAt = G.len; syncNeed(); }
  syncHud();

  // 笔尖火星
  const sp = toScreen(p);
  if (speed > .8 && G.t - G.lastEmit > .05 && G.particles.length < 90){
    G.lastEmit = G.t;
    addParticle(sp.x + (Math.random()-.5)*5, sp.y + (Math.random()-.5)*5,
                (Math.random()-.5)*10, -8-Math.random()*20,
                .35+Math.random()*.5, .7+Math.random()*1.2,
                Math.random()<.35 ? '#fff1d8' : '#ffbd7d', 10);
  }
  sfxScratch(speed);

  // 封口判定：① 线条自己交叉了（最自然）② 几乎绕满一圈并回到起点附近
  if (G.len > MIN_LEN && G.path.length > 10 && Math.abs(G.turn) > MIN_TURN){
    let cut = -1;
    for (let i = 0; i + 6 < G.path.length - 1; i++){
      const t = segHit(G.path[i], G.path[i+1], last, p);
      if (t >= 0){ cut = i + 1; break; }
    }
    if (cut >= 0){
      G.path = G.path.slice(0, cut);
      G.len = polyLen(G.path);
      seal();
      return;
    }
    const st = G.path[0];
    if (Math.abs(G.turn) > TURN_GAP && Math.hypot(p.x-st.x, p.y-st.y) < Math.min(CLOSE_R, 34)){
      seal();
    }
  }
}
function endStroke(){
  if (!G.drawing) return;
  G.drawing = false;
  if (G.state !== 'play' || G.over) return;
  if (G.path.length > 3 && G.len > MIN_LEN){
    fail('没接上');
  } else {
    G.path = []; G.rope = G.ropeFull; G.len = 0; G.turn = 0;
    G.nearStart = false; syncHud(); syncNeed(); els.hint.classList.remove('gone');
  }
}
function resetStroke(){
  G.path = []; G.drawing = false; G.rope = G.ropeFull;
  G.len = 0; G.turn = 0; G.over = false; G.nearStart = false; G.dim = 0;
  syncHud(); syncNeed(); els.hint.classList.remove('gone');
}
function showToast(text, bad, dur){
  els.toast.textContent = text;
  els.toast.classList.add('on');
  if (bad) els.toast.classList.add('bad'); else els.toast.classList.remove('bad');
  G.toastT = dur || 1;
}
function fail(msg){
  if (G.state !== 'play') return;
  G.drawing = false;
  const myId = ++G.failId;
  G.over = true;
  G.failT = 1;
  G.flash = .9; G.flashBad = true;
  const tip = G.path.length ? toScreen(G.path[G.path.length-1]) : {x:innerWidth/2, y:innerHeight/2};
  G.flashX = tip.x; G.flashY = tip.y;
  G.shake = Math.max(G.shake, 4.5);
  for (let i=0;i<14;i++){
    const a = Math.random()*Math.PI*2, sp = 12+Math.random()*56;
    addParticle(tip.x, tip.y, Math.cos(a)*sp, Math.sin(a)*sp-8,
                .45+Math.random()*.55, .8+Math.random()*1.6,
                Math.random()<.4 ? '#ff8f78' : '#c8614c', 60);
  }
  G.ripples.push({x:tip.x, y:tip.y, r0:8, r1:78, life:.45, max:.45, col:'rgba(255,110,90,.32)'});
  showToast(msg, true, .85);
  syncHud(); syncNeed();
  vibrate([12,40,12]);
  sfxFail();
  setTimeout(() => {
    if (myId !== G.failId) return;
    els.toast.classList.remove('on');
    if (G.state === 'play'){
      G.path = []; G.rope = G.ropeFull; G.len = 0; G.turn = 0; G.over = false;
      G.dim = 0; G.nearStart = false;
      syncHud(); syncNeed();
      els.hint.classList.remove('gone');
    }
  }, 780);
}
function seal(){
  const poly = G.path.slice();
  G.drawing = false;
  const L = LEVELS[G.idx];
  const area = polyArea(poly);
  const len = polyLen(poly);
  if (area < MIN_AREA || len < MIN_LEN){ fail('画得太窄了'); return; }

  G.area = area; G.path = poly; G.len = len;
  G.inside = L.objs.filter(o => inPoly(o, poly));

  if (G.inside.length < L.need){
    fail(`不够 · 只圈到 ${G.inside.length} 样`);
    return;
  }
  G.state = 'sealed';
  G.sealedAt = 0; G.sealT = 0; G.sealPulse = 1;
  G.over = false;
  const seam = toScreen(poly[0]);
  G.flash = 1; G.flashBad = false; G.flashX = seam.x; G.flashY = seam.y;
  G.shake = 6.5;
  burstSeam(seam.x, seam.y);
  L.objs.forEach((o, i) => {
    if (G.inside.indexOf(o) >= 0){
      const sp = toScreen(o);
      setTimeout(() => { if (G.state === 'sealed') burstKeep(sp.x, sp.y); }, 70 + i*80);
    }
  });
  L.objs.forEach(o => {
    if (G.inside.indexOf(o) >= 0) G.kept.push({o, i:G.idx});
    else G.left.push({o, i:G.idx});
  });
  syncNeed();
  showToast('封住了', false, 1.35);
  vibrate([18,50,28]);
  sfxSeal();
  // 用墙钟推进：掉帧时不会把“封口 → 下一站”拖长（截图夹具等 1.9s）
  setTimeout(() => {
    if (G.state === 'sealed'){ G.state = 'card'; nextChapter(); }
  }, 1350);
}

/* ══════════════════ 绘制 ══════════════════ */
let grainPat = null;
function makeGrain(){
  const n = 128, c = document.createElement('canvas');
  c.width = c.height = n;
  const g = c.getContext('2d');
  const img = g.createImageData(n, n);
  for (let i=0;i<n*n;i++){
    const v = 90 + Math.random()*165;
    img.data[i*4] = img.data[i*4+1] = img.data[i*4+2] = v;
    img.data[i*4+3] = 18;
  }
  g.putImageData(img, 0, 0);
  grainPat = ctx.createPattern(c, 'repeat');
}

function drawBg(w, h){
  // 顶灯跟着本关物件的重心，画面重心才落得住
  const cx = view.cx || w/2, cy = view.cy || h*0.46;
  const R = Math.max(w, h);
  let g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R*0.84);
  g.addColorStop(0, '#2e251b');
  g.addColorStop(0.40, '#1d1813');
  g.addColorStop(0.72, '#14110d');
  g.addColorStop(1, '#0a0908');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  const flick = 0.92 + Math.sin(G.t*0.9)*0.016;
  g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(w, h)*0.68);
  g.addColorStop(0, `rgba(255,172,96,${0.10*flick})`);
  g.addColorStop(0.45, `rgba(255,150,80,${0.042*flick})`);
  g.addColorStop(1, 'rgba(255,140,70,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  g = ctx.createLinearGradient(0, 0, 0, h*0.42);
  g.addColorStop(0, 'rgba(255,205,150,.035)');
  g.addColorStop(1, 'rgba(255,205,150,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h*0.42);
}

function drawGrid(alpha){
  // 方格纸：横竖都等分成接近正方形的格子
  const p = frame;
  if (!p.w || !p.h || alpha <= 0) return;
  const cell = Math.max(40, Math.min(54, Math.min(p.w, p.h)/14));
  const nx = Math.max(3, Math.round(p.w/cell)), ny = Math.max(3, Math.round(p.h/cell));
  ctx.save();
  ctx.strokeStyle = `rgba(255,228,190,${alpha})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i=1;i<nx;i++){ const x = Math.round(p.x + p.w*i/nx) + .5; ctx.moveTo(x, p.y); ctx.lineTo(x, p.y+p.h); }
  for (let j=1;j<ny;j++){ const y = Math.round(p.y + p.h*j/ny) + .5; ctx.moveTo(p.x, y); ctx.lineTo(p.x+p.w, y); }
  ctx.stroke();
  ctx.restore();
}

function drawPaperEdge(alpha){
  // 纸边 + 四角刻线：画在暗角之上，屏幕永远是一张有边的纸
  const p = frame;
  if (!p.w || !p.h || alpha <= 0) return;
  ctx.save();
  ctx.strokeStyle = `rgba(255,214,170,${alpha})`;
  ctx.lineWidth = 1;
  ctx.strokeRect(p.x + .5, p.y + .5, p.w - 1, p.h - 1);

  const t = 18;
  ctx.strokeStyle = `rgba(255,214,170,${Math.min(.5, alpha*1.5)})`;
  [[p.x,p.y,1,1],[p.x+p.w,p.y,-1,1],[p.x,p.y+p.h,1,-1],[p.x+p.w,p.y+p.h,-1,-1]].forEach(([x,y,sx,sy])=>{
    ctx.beginPath();
    ctx.moveTo(x+sx*t, y); ctx.lineTo(x, y); ctx.lineTo(x, y+sy*t);
    ctx.stroke();
  });
  ctx.restore();
}

function drawBoard(pcx, pcy){
  // 盘面在屏幕空间里画：一张铺满画面的纸，而不是一块缩在中间的方板
  const p = frame;
  if (!p.w || !p.h) return;
  ctx.save();

  // 光池：本关物件重心处提亮（范围收紧一点，纸面才有明暗）
  const R = Math.min(p.w, p.h) * 0.74;
  let g = ctx.createRadialGradient(pcx, pcy, 10, pcx, pcy, R);
  g.addColorStop(0, 'rgba(255,232,196,.078)');
  g.addColorStop(0.45, 'rgba(255,220,180,.032)');
  g.addColorStop(1, 'rgba(255,210,170,0)');
  ctx.fillStyle = g; ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.restore();

  drawGrid(.038);
}

function drawMotes(w, h){
  ctx.save();
  for (const m of G.motes){
    const x = m.x + Math.sin(G.t*m.sp + m.ph) * 12 * m.sw;
    const y = ((m.y - G.t*m.sp*26) % (h + 60) + h + 60) % (h + 60) - 30;
    const a = m.a * (0.55 + 0.45*Math.sin(G.t*0.8 + m.ph));
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = '#ffd9a8';
    ctx.beginPath(); ctx.arc(x, y, m.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function ribbonPath(P, baseW){
  const n = P.length;
  const L = [], R = [];
  for (let i=0;i<n;i++){
    const a = P[Math.max(0, i-1)], b = P[Math.min(n-1, i+1)];
    let dx = b.x-a.x, dy = b.y-a.y;
    const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const nx = -dy, ny = dx;
    const w = baseW * (P[i].w || 1) / 2;
    L.push({x:P[i].x + nx*w, y:P[i].y + ny*w});
    R.push({x:P[i].x - nx*w, y:P[i].y - ny*w});
  }
  ctx.beginPath();
  ctx.moveTo(L[0].x, L[0].y);
  for (let i=1;i<n-1;i++){
    ctx.quadraticCurveTo(L[i].x, L[i].y, (L[i].x+L[i+1].x)/2, (L[i].y+L[i+1].y)/2);
  }
  ctx.lineTo(L[n-1].x, L[n-1].y);
  ctx.lineTo(R[n-1].x, R[n-1].y);
  for (let i=n-1;i>0;i--){
    ctx.quadraticCurveTo(R[i].x, R[i].y, (R[i].x+R[i-1].x)/2, (R[i].y+R[i-1].y)/2);
  }
  ctx.lineTo(R[0].x, R[0].y);
  ctx.closePath();
}
function tracePoly(P){
  ctx.moveTo(P[0].x, P[0].y);
  for (let i=1;i<P.length;i++) ctx.lineTo(P[i].x, P[i].y);
  ctx.closePath();
}
function traceLine(P){
  ctx.beginPath();
  ctx.moveTo(P[0].x, P[0].y);
  for (let i=1;i<P.length;i++) ctx.lineTo(P[i].x, P[i].y);
}
function drawPath(P){
  if (!P.length) return;
  const sealed = G.state === 'sealed' || G.dim > .02;
  const bad = G.over;
  const base = sealed ? 4.2 : 3.6;

  if (P.length === 1){
    ctx.save(); ctx.fillStyle = '#ffeccf';
    ctx.beginPath(); ctx.arc(P[0].x, P[0].y, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.restore(); return;
  }

  // 外发光：让线像有温度
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  traceLine(P);
  ctx.strokeStyle = bad ? 'rgba(255,80,60,.16)'
                    : sealed ? 'rgba(255,178,110,.20)' : 'rgba(255,235,205,.10)';
  ctx.lineWidth = sealed ? 18 : 12;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();

  // 主体（粗细随速度变化）
  ctx.save();
  ribbonPath(P, base);
  ctx.fillStyle = bad ? 'rgba(255,126,102,.92)' : sealed ? '#ffd39c' : '#efe7d7';
  ctx.fill();
  const cap0 = base*(P[0].w||1)/2, capN = base*(P[P.length-1].w||1)/2;
  ctx.beginPath(); ctx.arc(P[0].x, P[0].y, cap0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(P[P.length-1].x, P[P.length-1].y, capN, 0, Math.PI*2); ctx.fill();
  // 锋
  traceLine(P);
  ctx.strokeStyle = bad ? 'rgba(255,220,210,.85)' : sealed ? 'rgba(255,246,230,.92)' : 'rgba(255,252,245,.82)';
  ctx.lineWidth = 1.05;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();

  // 收口提示：虚线 + 起点环
  if (!sealed && G.drawing && G.path.length > 4 && !G.over){
    const st = P[0], en = P[P.length-1];
    const near = G.nearStart;
    ctx.save();
    ctx.setLineDash([5, 7]);
    ctx.lineDashOffset = -G.t*10;
    ctx.strokeStyle = near ? 'rgba(255,201,138,.8)' : 'rgba(255,201,138,.28)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(en.x, en.y); ctx.lineTo(st.x, st.y); ctx.stroke();
    ctx.setLineDash(near ? [] : [3, 5]);
    ctx.strokeStyle = near ? 'rgba(255,214,160,.95)' : 'rgba(255,201,138,.4)';
    ctx.beginPath(); ctx.arc(st.x, st.y, near ? 11 + Math.sin(G.t*6)*1.6 : 9, 0, Math.PI*2); ctx.stroke();
    if (near){
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(255,214,160,.35)';
      ctx.beginPath(); ctx.arc(st.x, st.y, 20 + Math.sin(G.t*6)*2.5, 0, Math.PI*2); ctx.stroke();
    }
    ctx.restore();

    // 笔尖
    const tr = 24 + Math.sin(G.t*5)*3;
    const g = ctx.createRadialGradient(en.x, en.y, 0, en.x, en.y, tr);
    g.addColorStop(0, 'rgba(255,235,200,.5)');
    g.addColorStop(.45, 'rgba(255,190,120,.16)');
    g.addColorStop(1, 'rgba(255,180,110,0)');
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g; ctx.fillRect(en.x-tr, en.y-tr, tr*2, tr*2);
    ctx.fillStyle = '#fff6e6';
    ctx.beginPath(); ctx.arc(en.x, en.y, 2.1, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  if (sealed && P.length > 2){
    // 收口的结
    ctx.save();
    ctx.fillStyle = '#fff3de';
    ctx.beginPath(); ctx.arc(P[0].x, P[0].y, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,201,138,.85)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(P[0].x, P[0].y, 8 + Math.sin(G.t*3)*1.5, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

/* 标签排布：优先朝圈内 / 重心一侧，其次上下左右；
   逐个试方向，避开别的标签、别的物件和纸边——手机上也不会两行字叠在一起。 */
function planLabels(pts, ref, states, rope){
  const L = LEVELS[G.idx];
  const GAP = 17, R = G.objR || OBJ_R, LH = 16;
  const CLEAR = 10;                 // 名字的盒子离自己那个圈至少这么远
  const boxes = [], out = [];
  const area = (a, b) =>
    Math.max(0, Math.min(a.x+a.w, b.x+b.w) - Math.max(a.x, b.x)) *
    Math.max(0, Math.min(a.y+a.h, b.y+b.h) - Math.max(a.y, b.y));
  // 盒子到圆心的最近距离：斜着放时“中心距 R+GAP”并不等于“离圈边 GAP”，
  // 直接拿中心距当间距会让名字贴在自己的圈线上（手机上实测 0–2px）
  const boxGap = (b, cx, cy) =>
    Math.hypot(Math.max(b.x, Math.min(cx, b.x+b.w)) - cx,
               Math.max(b.y, Math.min(cy, b.y+b.h)) - cy);
  // 封口后绳子是静止的，可以让名字避开它；画的过程中路径每帧都在变，
  // 那时传入 null，名字不许跟着手抖。
  const ropeHit = rope ? (box) => {
    const x0 = box.x-4, y0 = box.y-4, x1 = box.x+box.w+4, y1 = box.y+box.h+4;
    let n = 0;
    for (let s = 1; s < rope.length; s++){
      const a = rope[s-1], b = rope[s];
      const dx = b.x-a.x, dy = b.y-a.y;
      let t0 = 0, t1 = 1, ok = true;
      const clip = (pp, qq) => {
        if (!pp) return qq >= 0;
        const r = qq/pp;
        if (pp < 0){ if (r > t1) return false; if (r > t0) t0 = r; }
        else { if (r < t0) return false; if (r < t1) t1 = r; }
        return true;
      };
      ok = clip(-dx, a.x-x0) && clip(dx, x1-a.x) && clip(-dy, a.y-y0) && clip(dy, y1-a.y);
      if (ok) n++;
    }
    return n;
  } : null;
  for (let i = 0; i < pts.length; i++){
    const p = pts[i], name = L.objs[i].name;
    const w = [...name].length * 13 + 2;   // 600 13px 的中文每字正好 13px，别把盒子估胖
    const dx = p.x - ref.x, dy = p.y - ref.y, d = Math.hypot(dx, dy) || 1;
    const sgn = states[i] === 'left' ? 1 : -1;     // 放手的朝外，留下的朝里
    const cands = [];
    if (d > 4) cands.push([dx/d*sgn, dy/d*sgn]);
    cands.push([0, 1], [0, -1], [1, 0], [-1, 0]);
    if (d > 4) cands.push([dx/d, dy/d], [-dx/d, -dy/d]);
    let best = null, bestScore = Infinity;
    for (let c = 0; c < cands.length; c++){
      const [ux, uy] = cands[c];
      const px = p.x + ux*(R + GAP), py = p.y + uy*(R + GAP) + 3;
      let align = 'center', bx = px - w/2;
      if (ux > .45){ align = 'left'; bx = px; }
      else if (ux < -.45){ align = 'right'; bx = px - w; }
      const box = { x:bx, y:py - LH/2, w, h:LH };
      // 不够远就沿着这个方向把盒子推出去，再判分（推完可能出纸边，所以先推后判）
      let lx = px, ly = py;
      for (let t = 0; t < 5; t++){
        const g = boxGap(box, p.x, p.y);
        if (g >= R + CLEAR) break;
        const k = R + CLEAR - g + 1;
        box.x += ux*k; box.y += uy*k; lx += ux*k; ly += uy*k;
      }
      let sc = c * 4;                                   // 越靠前的方向越优先
      if (box.x < frame.x + 6 || box.x + box.w > frame.x + frame.w - 6 ||
          box.y < frame.y + 6 || box.y + box.h > frame.y + frame.h - 6) sc += 500;
      for (let j = 0; j < pts.length; j++){
        if (j === i) continue;
        const q = pts[j];
        const dd = Math.hypot(lx - q.x, ly - q.y);
        if (dd < R + 26) sc += 70;                      // 压到别的物件
        // 名字横穿过别人那个圈，和线穿过字一样难读：越近罚越重，逼它换方向
        const g2 = boxGap(box, q.x, q.y);
        if (g2 < R + 6) sc += (R + 6 - g2) * 16;
        // 名字不能离别人的圈比离自己的还近：320 上「一支话筒」曾挪到门牌旁边，
        // 看着像在说「门」——这个方向的便宜不能占
        const own = boxGap(box, p.x, p.y);
        if (g2 < own + 10) sc += (own + 10 - g2) * 12;
      }
      // 标签之间要留出“呼吸”，不能只判“没重叠”：横屏时三个名字会排成一列，
      // 每个都算不重叠，读起来却像一段不相干的说明。按扩张后的盒子算重叠面积。
      const pad = { x:box.x-12, y:box.y-6, w:box.w+24, h:box.h+12 };
      for (const b of boxes) sc += area(pad, b) * 2.2;
      if (ropeHit){ const h = ropeHit(box); if (h) sc += 26 + h*8; }   // 线从字里穿过去
      if (sc < bestScore){ bestScore = sc; best = { x:lx, y:ly, align, box }; }
    }
    boxes.push(best.box);
    out.push(best);
  }
  return out;
}

const OBJ_R = 24;

function drawObj(o, state, idx, lab, sp){
  const sx = sp ? sp.x : o.x*view.s + view.ox;
  const sy = sp ? sp.y : o.y*view.s + view.oy;
  const r = sp ? OBJ_R : G.objR;
  const col = state === 'kept' ? '#ffd7a6' : state === 'live' ? '#f2ebdc'
            : state === 'ghost' ? '#ffffff' : '#9d9382';
  const alpha = state === 'left' ? .62 : state === 'ghost' ? .16 : 1;

  ctx.save();
  ctx.globalAlpha = alpha;

  // 被圈住的那一下：光晕鼓一下，不画第二圈同心环（那看着像扫描仪）
  let glow = 0;
  if (state === 'kept'){
    const dt = G.sealT - idx*.085;
    if (dt > 0 && dt < .65) glow = 1 - dt/.65;
  }
  if (state === 'live' || state === 'kept'){
    const hr = 50 + glow*30;
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, hr);
    g.addColorStop(0, state === 'kept' ? `rgba(255,180,110,${.17 + glow*.42})` : 'rgba(255,220,180,.055)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(sx-hr, sy-hr, hr*2, hr*2);
  }

  if (state === 'kept'){
    ctx.shadowColor = '#ffb36b'; ctx.shadowBlur = 16;
  }
  // 一个环就够：原来外面那圈同心环像扫描仪的准星
  const breathe = state === 'live' ? 1 + Math.sin(G.t*1.6 + idx)*.03 : 1;
  ctx.strokeStyle = col;
  ctx.lineWidth = state === 'kept' ? 1.5 : 1.1;
  ctx.beginPath(); ctx.arc(sx, sy, r*breathe, 0, Math.PI*2); ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.fillStyle = col;
  ctx.font = `${Math.max(15, Math.round(r*.76))}px "Songti SC","Noto Serif SC",STSong,SimSun,serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(o.ch, sx, sy + 1);

  if (state !== 'ghost' && lab){
    const lx = lab.x, ly = lab.y;
    ctx.textAlign = lab.align; ctx.textBaseline = 'middle';
    // 宋体 13px 太细，加半粗 + 亮一档，暗底上才真的读得清
    ctx.font = `600 13px "Songti SC","Noto Serif SC",STSong,SimSun,serif`;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(9,7,5,.92)';
    // 3px 描边挡不住圈线的外发光：线从字中间穿过时，光会在笔画之间渗进来。
    // 再给描边加一层同色柔光，等于把“墨”加厚一圈（只在亮底上看得见，暗底无副作用）。
    ctx.shadowColor = 'rgba(7,5,4,.92)'; ctx.shadowBlur = 7;
    ctx.strokeText(o.name, lx, ly);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = alpha * .98;
    // 放手的名字原来用 #a89d8a 再乘 .62，落到 3.3:1 —— 13px 这样太淡了，
    // 提一档到 ~4.5:1：圈和字形继续退到暗面，但“你放手了什么”要读得出来
    ctx.fillStyle = state === 'kept' ? '#ffd9a3' : state === 'left' ? '#d4c9b3' : '#e4d8c2';
    ctx.fillText(o.name, lx, ly);
  }
  ctx.restore();
}

function drawSealField(w, h, P){
  if (G.dim < .005 || P.length < 3) return;
  const d = G.dim;
  let cx = 0, cy = 0, rr = 0;
  for (const p of P){ cx += p.x; cy += p.y; }
  cx /= P.length; cy /= P.length;
  for (const p of P) rr = Math.max(rr, Math.hypot(p.x-cx, p.y-cy));
  rr = Math.max(90, rr);

  ctx.save();
  // 圈里：暖光
  ctx.beginPath(); tracePoly(P);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr*1.05);
  g.addColorStop(0, `rgba(255,186,112,${.16*d})`);
  g.addColorStop(.62, `rgba(255,168,94,${.075*d})`);
  g.addColorStop(1, 'rgba(255,160,80,0)');
  ctx.fillStyle = g; ctx.fill();

  // 圈外：世界暗下去（evenodd 把矩形挖掉一个圈）
  ctx.beginPath();
  ctx.rect(-300, -300, w+600, h+600);
  tracePoly(P);
  ctx.fillStyle = `rgba(4,4,5,${.22*d})`;
  ctx.fill('evenodd');

  // 压暗之后把方格补回来一点点：屏幕仍然是“一张纸”，不是黑洞
  drawGrid(.016*d);

  // 圈口一圈细光：把“里 / 外”分开
  ctx.beginPath(); tracePoly(P);
  ctx.strokeStyle = `rgba(255,200,140,${.30*d})`;
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.restore();
}

function drawFx(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of G.particles){
    const a = Math.max(0, p.life/p.max);
    ctx.globalAlpha = a * .9;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(0.35+a*0.9), 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
  for (const r of G.ripples){
    const k = 1 - r.life/r.max;
    ctx.save();
    ctx.globalAlpha = (1-k)*.75;
    ctx.strokeStyle = r.col;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1-r.r0)*k, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

function draw(){
  const w = window.innerWidth, h = window.innerHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBg(w, h);

  const sh = G.shake;
  const shx = Math.sin(G.t*81)*sh, shy = Math.cos(G.t*67)*sh*.7;

  ctx.save();
  ctx.translate(shx, shy);

  // 盘面（屏幕坐标：一张铺满画面的纸）
  // 封口后光池跟着圈走：亮的是你圈出来的那一块，不是关卡包围盒的中心
  let pcx = view.cx, pcy = view.cy;
  if (G.state === 'sealed' && G.inside.length){
    let ax = 0, ay = 0;
    for (const o of G.inside){ ax += o.x*view.s + view.ox; ay += o.y*view.s + view.oy; }
    pcx = ax/G.inside.length; pcy = ay/G.inside.length;
  }
  drawBoard(pcx, pcy);
  drawMotes(w, h);

  const P = G.path.map(toScreen);
  drawSealField(w, h, P);
  drawPath(P);

  // 物件（屏幕坐标，文字不随缩放变小）
  const L = LEVELS[G.idx];
  const isFinal = G.idx === LEVELS.length - 1;
  let ref = { x: view.cx + shx, y: view.cy + shy };
  if (G.state === 'sealed' && P.length > 2){
    let rx = 0, ry = 0;
    for (const p of P){ rx += p.x; ry += p.y; }
    ref = { x: rx/P.length + shx, y: ry/P.length + shy };
  }
  if (isFinal){
    // 末章的盘上铺着前五站的记忆：按 0.55 的距离收在“你自己”周围，
    // 否则按本关包围盒放大会把旧物件甩到屏幕外、压到 HUD 上
    for (const q of ghostPts) drawObj(q.o, 'ghost', 0, null, q);
  }
  const sts = L.objs.map(o =>
    G.state === 'sealed' ? (G.inside.indexOf(o) >= 0 ? 'kept' : 'left') : 'live');
  const pts = L.objs.map(o => ({ x:o.x*view.s + view.ox, y:o.y*view.s + view.oy }));
  const labs = planLabels(pts, ref, sts, G.state === 'sealed' ? P : null);
  L.objs.forEach((o, i) => {
    drawObj(o, sts[i], i, labs[i]);
  });

  // 笔尖停靠的位置：一个很轻的亮点，告诉手“从这里落下”
  if (G.state === 'play' && G.hover.on && !G.drawing && !G.over){
    const hx = G.hover.x, hy = G.hover.y;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, 26);
    hg.addColorStop(0, 'rgba(255,235,200,.14)');
    hg.addColorStop(.5, 'rgba(255,190,120,.07)');
    hg.addColorStop(1, 'rgba(255,180,110,0)');
    ctx.fillStyle = hg; ctx.fillRect(hx-26, hy-26, 52, 52);
    ctx.strokeStyle = 'rgba(255,214,160,.34)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(hx, hy, 6, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#fff6e6';
    ctx.beginPath(); ctx.arc(hx, hy, 2.1, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  drawFx();
  ctx.restore();

  // 闪光
  if (G.flash > .01){
    const R = Math.max(w, h)*.58;
    const g = ctx.createRadialGradient(G.flashX, G.flashY, 0, G.flashX, G.flashY, R);
    if (G.flashBad){
      g.addColorStop(0, `rgba(255,110,86,${.26*G.flash})`);
      g.addColorStop(.4, `rgba(220,70,50,${.1*G.flash})`);
    } else {
      g.addColorStop(0, `rgba(255,230,185,${.30*G.flash})`);
      g.addColorStop(.35, `rgba(255,184,112,${.12*G.flash})`);
    }
    g.addColorStop(1, 'rgba(255,150,80,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }

  // 颗粒
  if (grainPat){
    ctx.save();
    ctx.globalAlpha = .42;
    ctx.fillStyle = grainPat;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }
  // 暗角（留一点边缘呼吸）
  const vg = ctx.createRadialGradient(w/2, h*.47, Math.min(w, h)*.52, w/2, h*.5, Math.max(w, h)*.86);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.30)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);

  // 纸边最后画：暗角压不掉的“画框”
  drawPaperEdge(.20 + .10*G.dim);
}

/* ══════════════════ 主循环 ══════════════════ */
let last = 0;
function loop(ts){
  const dt = Math.min(0.05, (ts - last)/1000 || 0.016);
  last = ts;
  G.t += dt;

  if (G.toastT > 0){
    G.toastT -= dt;
    if (G.toastT <= 0) els.toast.classList.remove('on');
  }
  if (G.sealPulse > 0) G.sealPulse = Math.max(0, G.sealPulse - dt*1.6);
  if (G.state === 'sealed') G.dim = Math.min(1, G.dim + dt*4.5);
  else G.dim = Math.max(0, G.dim - dt*3);
  G.flash = Math.max(0, G.flash - dt*2.0);
  G.shake = Math.max(0, G.shake - dt*14);
  G.failT = Math.max(0, G.failT - dt*2);
  updateFx(dt);

  if (G.state === 'sealed'){
    G.sealedAt += dt;
    G.sealT += dt;
  }
  draw();
  requestAnimationFrame(loop);
}

/* ══════════════════ 输入 ══════════════════ */
function pos(e){
  const t = e.touches && e.touches[0] ? e.touches[0] : e;
  return { x:t.clientX, y:t.clientY };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  unlockAudio();
  const p = pos(e);
  startStroke(p.x, p.y);
});
cv.addEventListener('pointermove', e => {
  if (!G.drawing) return;
  e.preventDefault();
  const evs = (e.getCoalescedEvents ? e.getCoalescedEvents() : null) || [e];
  for (const q of evs){
    if (!G.drawing) break;
    moveStroke(q.clientX, q.clientY);
  }
});
cv.addEventListener('pointerup', e => { e.preventDefault(); endStroke(); });
cv.addEventListener('pointercancel', () => endStroke());
window.addEventListener('pointerup', () => endStroke());
window.addEventListener('pointermove', e => {
  if (e.pointerType !== 'touch' && typeof e.clientX === 'number'){
    G.hover.x = e.clientX; G.hover.y = e.clientY; G.hover.on = true;
  }
});

function toggleSound(){
  soundOn = !soundOn;
  if (soundOn){ unlockAudio(); sfxTick(); }
  els.snd.textContent = soundOn ? '声音 · 开' : '声音 · 关';
  els.snd.classList.toggle('off', !soundOn);
  try { if (els.snd.setAttribute) els.snd.setAttribute('aria-pressed', String(soundOn)); } catch(_){}
}
els.snd.addEventListener('click', e => {
  if (e && e.stopPropagation) e.stopPropagation();
  toggleSound();
});

window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R'){
    if (G.state === 'play'){ G.failId++; els.toast.classList.remove('on'); resetStroke(); }
  }
  if ((e.key === ' ' || e.key === 'Enter') && G.state === 'card'){ beginPlay(); }
  if (e.key === 'm' || e.key === 'M'){ toggleSound(); }
});

/* 章节卡：轻触继续 */
els.card.addEventListener('click', () => { if (G.state === 'card') beginPlay(); });

/* 结局 */
els.btnAgain.addEventListener('click', () => {
  G.kept = []; G.left = []; G.failId++;
  document.body.classList.remove('end-open');
  els.end.classList.remove('on');
  els.toast.classList.remove('on');
  loadLevel(0); showCard(0);
  sfxTick();
});
els.btnCopy.addEventListener('click', async () => {
  const txt = shareText();
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(txt);
      ok = true;
    }
  } catch(_){}
  if (!ok){
    try {
      const ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.top = '0';
      document.body.appendChild(ta);
      ta.select();
      if (document.execCommand) ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch(_){}
  }
  els.btnCopy.textContent = ok ? '已复制' : '长按上面那句话';
  if (ok) sfxTick();
});

/* ── 启动 ── */
makeGrain();
resize();
loadLevel(0);
showCard(0);
requestAnimationFrame(loop);

/* 供自动化测试使用 */
window.__game = { G, LEVELS, polyArea, polyLen, inPoly, seal, loadLevel, beginPlay, shareText, finish, showCard, nextChapter,
  getView: () => ({ s:view.s, ox:view.ox, oy:view.oy, cx:view.cx, cy:view.cy }),
  getFrame: () => ({ ...frame }), getSafe: () => ({ ...safe }), toScreen };
</script>
