<style>
  :root{
    --ink:#e9e3d5; --ink2:#9a9488; --dim:#4a4740;
    --warm:#ffc98a; --warm2:#ff9d5c; --paper:#0b0c0e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);
    font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",STSong,SimSun,serif;
    color:var(--ink);-webkit-font-smoothing:antialiased}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  #ui{position:fixed;inset:0;pointer-events:none;user-select:none}

  #top{position:absolute;left:26px;top:22px}
  #year{font-size:15px;letter-spacing:.28em;color:var(--ink);opacity:.92}
  #sub{font-size:11px;letter-spacing:.2em;color:var(--ink2);margin-top:5px}

  #side{position:absolute;right:26px;top:22px;text-align:right}
  #ropeLabel{font-size:11px;letter-spacing:.28em;color:var(--ink2)}
  #ropeBar{width:132px;height:2px;background:#ffffff1a;margin:9px 0 6px auto;position:relative;overflow:hidden}
  #ropeBar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--warm);
    transition:width .06s linear;transform-origin:left}
  #ropeNum{font-size:12px;letter-spacing:.08em;color:var(--warm);font-variant-numeric:tabular-nums}
  #needLine{font-size:12px;letter-spacing:.1em;color:var(--ink2);margin-top:12px}
  #needLine b{color:var(--warm);font-weight:400}

  #hint{position:absolute;left:0;right:0;bottom:26px;text-align:center;
    font-size:12px;letter-spacing:.16em;color:var(--ink2);opacity:.85;transition:opacity .5s}
  #hint.gone{opacity:0}

  #toast{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
    font-size:16px;letter-spacing:.22em;color:var(--warm2);opacity:0;transition:opacity .3s}
  #toast.on{opacity:1}

  /* 章节卡 */
  #card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#06070899;backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .55s}
  #card.on{opacity:1;pointer-events:auto}
  #card .in{text-align:center;max-width:520px;padding:0 28px}
  #card .y{font-size:13px;letter-spacing:.5em;color:var(--warm);opacity:.9}
  #card .t{font-size:34px;letter-spacing:.16em;margin:18px 0 22px;color:var(--ink)}
  #card .l{font-size:15px;line-height:2.1;color:var(--ink2);letter-spacing:.06em}
  #card .go{margin-top:34px;font-size:11px;letter-spacing:.3em;color:#ffffff44;animation:breathe 2.4s infinite}
  @keyframes breathe{0%,100%{opacity:.3}50%{opacity:.9}}

  /* 结局 */
  #end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#05060799;backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .8s}
  #end.on{opacity:1;pointer-events:auto}
  #end .in{text-align:center;max-width:560px;padding:0 28px}
  #end .k{font-size:11px;letter-spacing:.5em;color:var(--ink2)}
  #end h1{font-size:52px;letter-spacing:.22em;margin:22px 0 10px;font-weight:400;color:var(--ink)}
  #end .big{font-size:17px;line-height:2.3;color:var(--ink2);letter-spacing:.05em;margin-top:12px}
  #end .big b{color:var(--warm);font-weight:400}
  #end .stat{margin:30px auto 0;font-size:12px;letter-spacing:.14em;color:#ffffff55;line-height:2.2}
  #end button{margin-top:34px;background:none;border:1px solid #ffffff2e;color:var(--ink);
    font-family:inherit;font-size:13px;letter-spacing:.3em;padding:13px 30px;cursor:pointer;
    transition:.3s;border-radius:1px}
  #end button:hover{border-color:var(--warm);color:var(--warm)}
  #end .copy{margin-top:16px;font-size:11px;letter-spacing:.1em;color:#ffffff33;cursor:pointer;
    background:none;border:0;font-family:inherit}

  @media (max-width:520px){
    #end h1{font-size:38px}
    #card .t{font-size:26px}
    #top{left:18px;top:16px} #side{right:18px;top:16px}
  }

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════
   《画地为牢》
   绳长即周长。你圈住什么，就只剩什么。
   ══════════════════════════════════════════════════════════════ */

const LEVELS = JSON.parse(document.getElementById('levels').textContent);
const WORLD = 1000;                 // 世界是边长 1000 的正方形
const MIN_LEN = 130;                // 封口所需最短笔画
const CLOSE_R = 46;                 // 回到起点多少以内算封口
const MIN_AREA = 1500;              // 太扁的圈不算
const MIN_TURN = 2.6;               // 自交封口：至少转过 149°
const TURN_GAP = 5.2;               // 直接回到起点：几乎要绕满一圈

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const els = {
  year:$('year'), sub:$('sub'), ropeFill:$('ropeFill'), ropeNum:$('ropeNum'),
  need:$('needLine'), hint:$('hint'), toast:$('toast'),
  card:$('card'), cYear:$('cYear'), cTitle:$('cTitle'), cLine:$('cLine'),
  end:$('end'), eBig:$('eBig'), eStat:$('eStat'),
};

/* ── 视图 ── */
let view = { s:1, ox:0, oy:0 };
let dpr = 1;
function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  cv.style.width = w+'px'; cv.style.height = h+'px';
  const s = Math.min(w*0.94, h*0.78) / WORLD;
  view = { s, ox:(w - WORLD*s)/2, oy:(h - WORLD*s)*0.52 };
}
window.addEventListener('resize', resize);

function toWorld(cx, cy){
  return { x:(cx - view.ox)/view.s, y:(cy - view.oy)/view.s };
}

/* ── 状态 ── */
const G = {
  state:'card',           // card | play | sealed | end
  idx:0, rope:0, ropeFull:0,
  path:[], drawing:false, len:0, turn:0, over:false,
  area:0, inside:[], sealedAt:0, toastT:0, failId:0,
  kept:[], left:[],
  t:0, sealPulse:0,
};

/* ── 几何 ── */
function segHit(p1,p2,p3,p4){
  const d = (p2.x-p1.x)*(p4.y-p3.y) - (p2.y-p1.y)*(p4.x-p3.x);
  if (Math.abs(d) < 1e-9) return -1;
  const t = ((p3.x-p1.x)*(p4.y-p3.y) - (p3.y-p1.y)*(p4.x-p3.x)) / d;
  const u = ((p3.x-p1.x)*(p2.y-p1.y) - (p3.y-p1.y)*(p2.x-p1.x)) / d;
  if (t > 0.03 && t < 0.97 && u > 0.03 && u < 0.97) return t;
  return -1;
}
function polyLen(p){
  let L = 0;
  for (let i=1;i<p.length;i++) L += Math.hypot(p[i].x-p[i-1].x, p[i].y-p[i-1].y);
  return L;
}
function polyArea(p){
  let a = 0;
  for (let i=0,n=p.length;i<n;i++){
    const q = p[(i+1)%n];
    a += p[i].x*q.y - q.x*p[i].y;
  }
  return Math.abs(a)/2;
}
function inPoly(pt, poly){
  let c = false;
  for (let i=0,j=poly.length-1;i<poly.length;j=i++){
    const a = poly[i], b = poly[j];
    if (((a.y>pt.y) !== (b.y>pt.y)) &&
        (pt.x < (b.x-a.x)*(pt.y-a.y)/(b.y-a.y)+a.x)) c = !c;
  }
  return c;
}

/* ── 关卡 ── */
function loadLevel(i){
  G.idx = i;
  const L = LEVELS[i];
  G.ropeFull = L.rope; G.rope = L.rope;
  G.path = []; G.drawing = false; G.len = 0; G.turn = 0; G.over = false;
  G.area = 0; G.inside = []; G.sealedAt = 0; G.sealPulse = 0;
  els.year.textContent = L.year;
  els.sub.textContent = `第 ${i+1} 站 / ${LEVELS.length}`;
  els.need.innerHTML = `圈住 <b>${L.need}</b> 样`;
  els.hint.classList.remove('gone');
  syncHud();
}
function syncHud(){
  const k = Math.max(0, G.rope/G.ropeFull);
  els.ropeFill.style.width = (k*100).toFixed(1)+'%';
  els.ropeNum.textContent = Math.max(0, Math.round(G.rope));
  els.ropeFill.style.background = k < 0.22 ? '#ff6b5c' : 'var(--warm)';
}

/* ── 作画 ── */
function startStroke(x, y){
  if (G.state !== 'play' || G.toastT > 0) return;
  const p = toWorld(x, y);
  G.path = [p]; G.drawing = true; G.over = false; G.len = 0; G.turn = 0;
  G.rope = G.ropeFull; G.area = 0; G.inside = [];
  els.hint.classList.add('gone');
  syncHud();
}
function moveStroke(x, y){
  if (!G.drawing || G.state !== 'play') return;
  const p = toWorld(x, y);
  const last = G.path[G.path.length-1];
  const d = Math.hypot(p.x-last.x, p.y-last.y);
  if (d < 2.2) return;
  if (G.rope - d < 0){
    // 绳子用完了
    G.rope = 0; syncHud();
    fail('绳子不够了');
    return;
  }
  // 累计转角：只有真的绕了一圈才允许封口，避免起手一个小弯就误判
  if (G.path.length >= 2){
    const a0 = G.path[G.path.length-2], b0 = last;
    const v1x = b0.x-a0.x, v1y = b0.y-a0.y, v2x = p.x-b0.x, v2y = p.y-b0.y;
    G.turn += Math.atan2(v1x*v2y - v1y*v2x, v1x*v2x + v1y*v2y);
  }

  G.rope -= d; G.len += d;
  G.path.push(p);
  syncHud();
  // 封口判定：① 线条自己交叉了（最自然）② 几乎绕满一圈并回到起点附近
  if (G.len > MIN_LEN && G.path.length > 10 && Math.abs(G.turn) > MIN_TURN){
    // ① 自交
    let cut = -1;
    for (let i = 0; i + 6 < G.path.length - 1; i++){
      const t = segHit(G.path[i], G.path[i+1], last, p);
      if (t >= 0){ cut = i + 1; break; }
    }
    if (cut >= 0){
      G.path = G.path.slice(0, cut);
      G.len = polyLen(G.path);
      seal();
      return;
    }
    // ② 回到起点
    const st = G.path[0];
    if (Math.abs(G.turn) > TURN_GAP && Math.hypot(p.x-st.x, p.y-st.y) < Math.min(CLOSE_R, 34)){
      seal();
    }
  }
}
function endStroke(){
  if (!G.drawing) return;
  G.drawing = false;
  if (G.state !== 'play') return;
  if (G.path.length > 3 && G.len > MIN_LEN) fail('没接上');
}

function fail(msg){
  if (G.state !== 'play') return;
  G.drawing = false;
  const myId = ++G.failId;
  G.over = true;
  G.toastT = 0.85;
  els.toast.textContent = msg;
  els.toast.classList.add('on');
  setTimeout(() => {
    if (myId !== G.failId) return;
    els.toast.classList.remove('on');
    if (G.state === 'play'){
      G.path = []; G.rope = G.ropeFull; G.len = 0; G.turn = 0; G.over = false;
      syncHud();
      els.hint.classList.remove('gone');
    }
  }, 780);
}

function seal(){
  const poly = G.path.slice();
  G.drawing = false;
  const L = LEVELS[G.idx];
  const area = polyArea(poly);
  const len = polyLen(poly);
  if (area < MIN_AREA || len < MIN_LEN){ fail('画得太窄了'); return; }

  G.area = area; G.path = poly; G.len = len;
  G.inside = L.objs.filter(o => inPoly(o, poly));

  if (G.inside.length < L.need){
    fail(`${G.inside.length} 样不够 · 要圈住 ${L.need} 样`);
    return;
  }
  G.state = 'sealed';
  G.sealedAt = 0;
  G.sealPulse = 1;
  L.objs.forEach(o => {
    if (G.inside.indexOf(o) >= 0) G.kept.push({o, i:G.idx});
    else G.left.push({o, i:G.idx});
  });
}

/* ── 推进 ── */
function showCard(i){
  const L = LEVELS[i];
  G.state = 'card';
  els.cYear.textContent = L.year;
  els.cTitle.textContent = L.title;
  els.cLine.innerHTML = L.line;
  els.card.classList.add('on');
}
function beginPlay(){
  els.card.classList.remove('on');
  G.state = 'play';
}
function nextChapter(){
  const n = G.idx + 1;                 // loadLevel 会改写 G.idx，先算好
  if (n >= LEVELS.length){ finish(); return; }
  loadLevel(n);
  showCard(n);
}

function finish(){
  G.state = 'end';
  const kept = G.kept.length, left = G.left.length;
  const names = G.kept.map(k => '「'+k.o.name+'」').join('、');
  els.eBig.innerHTML = `你一共圈住了 <b>${kept}</b> 样东西，<br>放手了 <b>${left}</b> 样。` +
    (names ? `<br><span style="font-size:13px;color:#ffffff44;letter-spacing:.04em">${names}</span>` : '') +
    `<br><br>绳子越短，圈越小。<br>最后一站，你只圈住了自己。`;
  const total = LEVELS.reduce((a,l)=>a+l.objs.length, 0);
  const titles = [
    [total,        '一样都没落下'],
    [total-3,      '几乎都带走了'],
    [total-6,      '圈得很大'],
    [total-9,      '刚刚够'],
    [total-11,     '一样多的都没留住'],
    [0,            '只剩你自己'],
  ];
  const t = titles.find(x => kept >= x[0]);
  els.eStat.textContent = `称号 · ${t[1]}`;
  els.end.classList.add('on');
}

/* ── 绘制 ── */
let grainPat = null;
function makeGrain(){
  const n = 128, c = document.createElement('canvas');
  c.width = c.height = n;
  const g = c.getContext('2d');
  const img = g.createImageData(n, n);
  for (let i=0;i<n*n;i++){
    const v = Math.random()*255;
    img.data[i*4] = img.data[i*4+1] = img.data[i*4+2] = v;
    img.data[i*4+3] = 26;
  }
  g.putImageData(img, 0, 0);
  grainPat = ctx.createPattern(c, 'repeat');
}

function drawBg(w, h){
  const grd = ctx.createRadialGradient(w/2, h*0.46, 0, w/2, h*0.46, Math.max(w,h)*0.78);
  grd.addColorStop(0, '#141518');
  grd.addColorStop(0.55, '#0c0d10');
  grd.addColorStop(1, '#070809');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, w, h);
}

function drawGround(){
  const L = LEVELS[G.idx];
  ctx.save();
  // 世界边框（很淡）
  ctx.strokeStyle = '#ffffff0d';
  ctx.lineWidth = 1/view.s;
  ctx.strokeRect(0, 0, WORLD, WORLD);
  // 网格
  ctx.strokeStyle = '#ffffff06';
  for (let i=1;i<10;i++){
    const p = i*WORLD/10;
    ctx.beginPath(); ctx.moveTo(p,0); ctx.lineTo(p,WORLD); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,p); ctx.lineTo(WORLD,p); ctx.stroke();
  }
  ctx.restore();
}

function drawObj(o, state){
  // state: 'live' | 'kept' | 'left' | 'ghost'
  // 屏幕空间固定尺寸，保证手机上文字也读得清
  const sx = o.x*view.s + view.ox, sy = o.y*view.s + view.oy;
  const r = 18;
  const col = state==='kept' ? '#ffc98a' : state==='live' ? '#ded7c6'
            : state==='ghost' ? '#ffffff1c' : '#6b665c';
  const alpha = state==='left' ? 0.34 : state==='ghost' ? 0.5 : 1;

  ctx.save();
  ctx.globalAlpha = alpha;

  if (state==='kept'){
    ctx.shadowColor = '#ffb36b'; ctx.shadowBlur = 18;
  }
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.fillStyle = col;
  ctx.font = `15px "Songti SC","Noto Serif SC",STSong,SimSun,serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(o.ch, sx, sy + 1);

  ctx.globalAlpha = alpha * 0.8;
  ctx.font = `11px "Songti SC","Noto Serif SC",STSong,SimSun,serif`;
  ctx.fillStyle = state==='kept' ? '#ffc98a' : '#8d877a';
  ctx.fillText(o.name, sx, sy + r + 13);
  ctx.restore();
}

function drawPath(){
  const p = G.path;
  if (p.length < 2) return;
  const sealed = G.state === 'sealed';

  if (sealed){
    // 圈内暖光
    let cx=0, cy=0;
    for (const q of p){ cx+=q.x; cy+=q.y; }
    cx/=p.length; cy/=p.length;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 420);
    g.addColorStop(0, 'rgba(255,178,110,0.16)');
    g.addColorStop(1, 'rgba(255,178,110,0.03)');
    ctx.save();
    ctx.beginPath(); ctx.moveTo(p[0].x, p[0].y);
    for (let i=1;i<p.length;i++) ctx.lineTo(p[i].x, p[i].y);
    ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // 外发光
  ctx.beginPath(); ctx.moveTo(p[0].x, p[0].y);
  for (let i=1;i<p.length;i++) ctx.lineTo(p[i].x, p[i].y);
  if (sealed) ctx.closePath();
  ctx.strokeStyle = sealed ? 'rgba(255,190,120,0.30)' : 'rgba(233,227,213,0.22)';
  ctx.lineWidth = (sealed?16:12)/view.s;
  ctx.stroke();
  // 主线
  ctx.strokeStyle = sealed ? '#ffcf96' : '#e9e3d5';
  ctx.lineWidth = 3.4/view.s;
  ctx.stroke();
  // 笔锋
  ctx.strokeStyle = sealed ? '#fff3e0' : '#ffffff';
  ctx.lineWidth = 1.1/view.s;
  ctx.stroke();
  ctx.restore();

  // 收口提示：从笔尖连回起点的一条虚线，告诉你“现在松手会闭成什么样”
  if (!sealed && G.drawing && p.length > 6){
    const st = p[0], en = p[p.length-1];
    ctx.save();
    ctx.setLineDash([6/view.s, 7/view.s]);
    ctx.strokeStyle = 'rgba(255,201,138,0.32)';
    ctx.lineWidth = 1.2/view.s;
    ctx.beginPath(); ctx.moveTo(en.x, en.y); ctx.lineTo(st.x, st.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,201,138,0.8)';
    ctx.beginPath(); ctx.arc(st.x, st.y, 3.2/view.s, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function draw(){
  const w = window.innerWidth, h = window.innerHeight;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawBg(w, h);

  ctx.setTransform(dpr*view.s, 0, 0, dpr*view.s, dpr*view.ox, dpr*view.oy);
  drawGround();

  const L = LEVELS[G.idx];
  const isFinal = G.idx === LEVELS.length-1;

  drawPath();

  // 物件用屏幕坐标画（文字尺寸不随缩放变化）
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if (isFinal){
    G.kept.forEach(k => drawObj(k.o, 'ghost'));
    G.left.forEach(k => drawObj(k.o, 'ghost'));
  }
  L.objs.forEach(o => {
    let st2 = 'live';
    if (G.state === 'sealed') st2 = G.inside.indexOf(o) >= 0 ? 'kept' : 'left';
    drawObj(o, st2);
  });

  // 封口脉冲（屏幕空间）
  if (G.sealPulse > 0){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.save();
    const cx = G.path[0].x*view.s + view.ox, cy = G.path[0].y*view.s + view.oy;
    const r = (1-G.sealPulse)*220 + 26;
    ctx.strokeStyle = `rgba(255,200,140,${G.sealPulse*0.5})`;
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // 颗粒
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if (grainPat){
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = grainPat;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  }
  // 暗角
  const vg = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.32, w/2, h/2, Math.max(w,h)*0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);
}

/* ── 主循环 ── */
let last = 0;
function loop(ts){
  const dt = Math.min(0.05, (ts - last)/1000 || 0.016);
  last = ts;
  G.t += dt;
  if (G.toastT > 0) G.toastT -= dt;
  if (G.sealPulse > 0) G.sealPulse = Math.max(0, G.sealPulse - dt*1.6);
  if (G.state === 'sealed'){
    G.sealedAt += dt;
    if (G.sealedAt > 1.5){
      G.state = 'card';
      setTimeout(nextChapter, 260);
    }
  }
  draw();
  requestAnimationFrame(loop);
}

/* ── 输入 ── */
function pos(e){
  const t = e.touches && e.touches[0] ? e.touches[0] : e;
  return { x:t.clientX, y:t.clientY };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  const p = pos(e); startStroke(p.x, p.y);
});
cv.addEventListener('pointermove', e => { if (!G.drawing) return; e.preventDefault(); const p = pos(e); moveStroke(p.x, p.y); });
cv.addEventListener('pointerup',   e => { e.preventDefault(); endStroke(); });
cv.addEventListener('pointercancel', () => endStroke());
window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R'){
    if (G.state === 'play'){ G.path = []; G.rope = G.ropeFull; G.len = 0; G.turn = 0; G.over = false; syncHud(); els.hint.classList.remove('gone'); }
  }
  if (e.key === ' ' && G.state === 'card'){ beginPlay(); }
});

/* 章节卡：轻触继续 */
els.card.addEventListener('click', () => { if (G.state === 'card') beginPlay(); });

/* 结局 */
$('btnAgain').addEventListener('click', () => {
  G.kept = []; G.left = [];
  els.end.classList.remove('on');
  loadLevel(0); showCard(0);
});
$('btnCopy').addEventListener('click', async () => {
  const n = G.kept.length;
  const txt = `我在《画地为牢》里圈住了 ${n} 样东西，放手了 ${G.left.length} 样。绳子每一站都在变短，你舍得放下几样？`;
  try { await navigator.clipboard.writeText(txt); $('btnCopy').textContent = '已复制'; }
  catch(e){ $('btnCopy').textContent = txt.slice(0, 18)+'…'; }
});

/* ── 启动 ── */
makeGrain();
resize();
loadLevel(0);
showCard(0);
requestAnimationFrame(loop);

/* 供自动化测试使用 */
window.__game = { G, LEVELS, polyArea, polyLen, inPoly, seal, loadLevel, beginPlay };
</script>
