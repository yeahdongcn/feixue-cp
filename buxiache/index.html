<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>不下车 · 一个粉丝的二十年</title>
<meta name="theme-color" content="#08080a">
<style>
:root{
  --maxw:720px;
  --bg:#0a1226; --bg2:#12203d; --fg:#e8eefc; --dim:#8fa3c8;
  --accent:#8ef2c0; --card:#101d36; --line:#24365c;
  --vig:#000a;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --serif:"Songti SC","SimSun","Noto Serif SC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
  transition:background .9s ease,color .9s ease;
  overflow:hidden;
}
/* ── themes ─────────────────────────────── */
body[data-theme="night"]{--bg:#081227;--bg2:#101f3c;--fg:#e9eefb;--dim:#8ea4c9;--accent:#8ff0c2;--card:#0e1c34;--line:#22345a;--font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif}
body[data-theme="bbs"]{--vig:transparent;--bg:#f3efe4;--bg2:#eae4d4;--fg:#1d1c1a;--dim:#6d6555;--accent:#1b4fbf;--card:#fffdf7;--line:#d5cbb4;--font:"Songti SC","SimSun","Noto Serif SC",serif}
body[data-theme="city"]{--bg:#17181b;--bg2:#202227;--fg:#d8dade;--dim:#83888f;--accent:#9fb0c4;--card:#1e2024;--line:#303338}
body[data-theme="stage"]{--bg:#170a1c;--bg2:#2a0f2f;--fg:#f8ebff;--dim:#b191c2;--accent:#ff5fa2;--card:#240d29;--line:#40203f}
body[data-theme="feed"]{--bg:#000;--bg2:#0d0d10;--fg:#f2f2f5;--dim:#8b8b93;--accent:#ff2d55;--card:#141418;--line:#26262c}
body[data-theme="snow"]{--bg:#0b141d;--bg2:#14222f;--fg:#eaf4ff;--dim:#8fa8bd;--accent:#a8dcff;--card:#111e29;--line:#25384a}
body[data-theme="end"]{--bg:#07070a;--bg2:#101014;--fg:#eceaf0;--dim:#8a8694;--accent:#d3bb85;--card:#111114;--line:#282830}

/* ── shell ──────────────────────────────── */
#stage{
  position:fixed;inset:0;display:flex;flex-direction:column;
  max-width:var(--maxw);margin:0 auto;
}
#stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% 0%,color-mix(in oklab,var(--accent) 9%,transparent),transparent 60%),
    radial-gradient(140% 100% at 50% 120%,var(--vig),transparent 55%);
  transition:background .9s ease;
}
#stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.035;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
}
#hud{
  position:relative;z-index:6;display:flex;align-items:center;gap:10px;
  padding:14px 18px 8px;font-size:11px;letter-spacing:.14em;color:var(--dim);
  text-transform:uppercase;flex:none;
}
#chap{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.meters{display:flex;gap:8px;align-items:center}
.meter{width:44px;height:3px;border-radius:2px;background:color-mix(in oklab,var(--fg) 14%,transparent);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;width:0;transition:width .5s cubic-bezier(.3,1,.4,1)}
.meter.z i{background:#ff5f8f}.meter.q i{background:#6fe3d2}
#bagBtn{
  position:relative;z-index:6;border:1px solid var(--line);background:var(--card);color:var(--dim);
  font:inherit;font-size:10px;letter-spacing:.1em;padding:4px 9px;border-radius:20px;cursor:pointer;
  transition:.3s;white-space:nowrap
}
#bagBtn:hover{color:var(--fg);border-color:var(--accent)}
#bagBtn b{color:var(--accent);font-weight:600}

#scene{
  position:relative;z-index:5;flex:1;display:flex;flex-direction:column;
  padding:6px 22px 0;overflow:hidden;min-height:0;
}
#scene.tap::after{
  content:"轻触继续";position:absolute;right:22px;bottom:6px;z-index:7;
  font-size:10px;letter-spacing:.2em;color:var(--dim);opacity:.45;pointer-events:none
}
#kicker{
  font-size:11px;letter-spacing:.2em;color:var(--accent);opacity:.8;
  min-height:15px;flex:none;font-weight:600;
}
#text{
  flex:1;overflow-y:auto;padding:12px 0 4px;min-height:0;
  scrollbar-width:none;-ms-overflow-style:none;
}
#text::-webkit-scrollbar{display:none}
#text p{margin:0 0 .72em;line-height:1.95;font-size:16.5px;letter-spacing:.012em;animation:pin .5s both}
@keyframes pin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
#text p.nar{color:var(--fg);opacity:.94}
#text p.dia{color:var(--fg);padding-left:2px}
#text p.dia .who{
  display:inline-block;margin-right:.55em;font-size:12px;letter-spacing:.1em;
  color:var(--accent);border:1px solid color-mix(in oklab,var(--accent) 40%,transparent);
  padding:1px 7px;border-radius:3px;vertical-align:.12em;font-weight:600;
}
#text p.big{
  font-family:var(--serif);font-size:26px;line-height:1.6;text-align:center;
  padding:1.1em .4em;margin:.6em 0;color:var(--fg);letter-spacing:.04em;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
#text p.note{font-size:12.5px;color:var(--dim);line-height:1.9;letter-spacing:.02em;font-family:var(--font)}
#text p.bbs{
  font-size:15.5px;padding:9px 12px;margin:0 0 .5em;background:var(--card);
  border-left:3px solid var(--accent);line-height:1.8;
}
#text p.sys{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--dim);letter-spacing:.02em;line-height:1.8}

#choices{flex:none;padding:4px 0 22px;display:flex;flex-direction:column;gap:9px;max-height:64vh;overflow-y:auto;scrollbar-width:none}
#choices::-webkit-scrollbar{display:none}
.choice{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:var(--card);color:var(--fg);border:1px solid var(--line);
  padding:13px 16px;border-radius:11px;font:inherit;font-size:15px;line-height:1.5;
  transition:.22s;animation:cin .45s both;position:relative;overflow:hidden
}
.choice::after{
  content:"";position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in oklab,var(--accent) 16%,transparent),transparent 55%);
  opacity:0;transition:.25s
}
.choice:hover{border-color:var(--accent);transform:translateX(3px)}
.choice:hover::after{opacity:1}
.choice .ct{position:relative;z-index:1;display:block}
.choice .cs{position:relative;z-index:1;display:block;margin-top:4px;font-size:12px;color:var(--dim);letter-spacing:.02em}
.choice.cont{
  text-align:center;background:transparent;border-style:dashed;border-color:var(--line);
  color:var(--dim);font-size:12.5px;letter-spacing:.3em;padding:11px;text-indent:.3em
}
.choice.cont::after{display:none}
.choice.cont:hover{color:var(--fg);border-color:var(--accent);transform:none}
@keyframes cin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── danmu ──────────────────────────────── */
#danmu{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.dm{
  position:absolute;white-space:nowrap;font-size:13px;color:#fff;opacity:.5;
  text-shadow:0 1px 4px #000c;animation:fly linear forwards;
}
@keyframes fly{from{transform:translateX(100vw)}to{transform:translateX(-120%)}}

/* ── mini games ─────────────────────────── */
.mini{margin-top:6px;padding:16px;border:1px dashed var(--line);border-radius:14px;background:var(--card)}
.mini .lbl{font-size:11px;letter-spacing:.18em;color:var(--dim);margin-bottom:10px}
.btn{
  width:100%;cursor:pointer;font:inherit;font-size:15px;padding:15px;border-radius:11px;
  border:1px solid var(--accent);background:color-mix(in oklab,var(--accent) 12%,var(--card));
  color:var(--fg);transition:.15s;user-select:none;-webkit-user-select:none;touch-action:none
}
.btn:active{transform:scale(.985);background:color-mix(in oklab,var(--accent) 26%,var(--card))}
.btn.ghost{border-color:var(--line);background:transparent;color:var(--dim);font-size:13px;padding:11px;margin-top:9px}
.track{height:5px;border-radius:3px;background:color-mix(in oklab,var(--fg) 12%,transparent);overflow:hidden;margin:14px 0 8px}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
.ticks{margin-top:12px;font-size:13px;line-height:1.85;color:var(--dim);min-height:60px}
.ticks b{color:var(--fg);font-weight:400}
.phone{border:1px solid var(--line);border-radius:14px;padding:14px;background:#00000055;font-family:ui-monospace,Menlo,monospace}
.phone .sms{font-size:12.5px;line-height:1.75;color:var(--accent);min-height:52px;white-space:pre-wrap}
.cards{display:flex;flex-direction:column;gap:10px;max-height:none}
.card{
  border:1px solid var(--line);border-radius:13px;background:var(--card);padding:13px 14px;cursor:pointer;
  transition:.2s;animation:cin .4s both
}
.card:hover{border-color:var(--accent)}
.card .src{font-size:10.5px;letter-spacing:.1em;color:var(--dim);margin-bottom:6px}
.card .ttl{font-size:15px;line-height:1.55;font-weight:500}
.card .meta{font-size:11.5px;color:var(--dim);margin-top:8px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.card .save{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--dim)}
.card.on{border-color:var(--accent)}
.card.on .save{color:var(--accent);border-color:var(--accent)}

/* ── overlays ───────────────────────────── */
.overlay{
  position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(90% 70% at 50% 30%,#131a2e,#05060a 70%);
  padding:28px;overflow-y:auto
}
.overlay.hide{opacity:0;pointer-events:none;transition:opacity .7s}
.t-inner{max-width:460px;text-align:center}
.t-sub{font-size:11px;letter-spacing:.5em;color:#7d8aa5;margin-bottom:22px;text-indent:.5em}
h1{
  margin:0;font-family:var(--serif);font-size:64px;letter-spacing:.14em;font-weight:400;
  color:#f2f4fa;text-indent:.14em;
  animation:glow 4s ease-in-out infinite alternate;
}
@keyframes glow{from{text-shadow:0 0 30px #7bb7ff22}to{text-shadow:0 0 50px #9fd8ff44}}
.t-line{margin-top:16px;font-size:13px;letter-spacing:.32em;color:#8fa1bd;text-indent:.32em}
#startBtn{
  margin-top:38px;background:transparent;border:1px solid #39445c;color:#dfe6f3;
  font:inherit;font-size:14px;letter-spacing:.35em;padding:14px 40px;border-radius:2px;cursor:pointer;transition:.35s;text-indent:.35em
}
#startBtn:hover{background:#dfe6f3;color:#0a1020;border-color:#dfe6f3}
.t-note{margin-top:40px;font-size:10.5px;line-height:2;color:#5a6478;letter-spacing:.02em;text-align:left}

/* bag */
#bag{position:fixed;inset:0;z-index:50;background:#05060ae8;backdrop-filter:blur(14px);overflow-y:auto;padding:26px 20px 60px;display:none}
#bag.on{display:block;animation:pin .35s}
.bag-in{max-width:640px;margin:0 auto}
.bag-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.bag-hd h2{font-family:var(--serif);font-size:24px;font-weight:400;margin:0;letter-spacing:.1em;color:#eef0f6}
.bag-hd button{background:none;border:1px solid #2b303c;color:#8b93a5;font:inherit;font-size:12px;padding:6px 14px;border-radius:20px;cursor:pointer}
.bag-sub{font-size:11.5px;color:#6d7688;letter-spacing:.06em;margin-bottom:22px;line-height:1.9}
.item{border-top:1px solid #1e222b;padding:14px 0}
.item .n{font-size:15px;color:#e6e9f1;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.item .d{font-size:12.5px;color:#8b93a5;line-height:1.85;margin-top:6px}
.item .nt{font-size:11.5px;color:#6d7688;line-height:1.85;margin-top:6px;font-style:italic}
.chip{font-size:10px;letter-spacing:.08em;padding:2px 8px;border-radius:20px;border:1px solid;white-space:nowrap}
.v-true{color:#6fe3a8;border-color:#2a6b4e}
.v-luo{color:#f0c36a;border-color:#6b532a}
.v-unv{color:#8f9bb3;border-color:#3a4152}
.v-read{color:#e08fc0;border-color:#6b2a52}
.empty{color:#5a6478;font-size:13px;padding:30px 0;text-align:center}

/* ending */
#endwrap{position:fixed;inset:0;z-index:45;background:#07070a;overflow-y:auto;display:none;padding:0}
#endwrap.on{display:block}
.end-in{max-width:680px;margin:0 auto;padding:52px 24px 90px}
.end-tag{font-size:10.5px;letter-spacing:.4em;color:#8a7f66;margin-bottom:18px;text-indent:.4em}
.end-title{font-family:var(--serif);font-size:40px;letter-spacing:.08em;color:#f1eee6;margin:0 0 6px;font-weight:400}
.end-sub{font-size:12px;color:#7d7688;letter-spacing:.18em;margin-bottom:34px}
.end-body p{font-size:15.5px;line-height:2.05;color:#d9d6de;margin:0 0 1.1em}
.end-body p.note{font-size:12.5px;color:#7f7a88;line-height:1.95}
.rule{height:1px;background:#24222a;margin:38px 0}
.recap-h{font-size:11px;letter-spacing:.3em;color:#8a7f66;margin-bottom:18px;text-indent:.3em}
.stat-row{display:flex;gap:26px;margin:0 0 28px}
.stat{flex:1}
.stat .k{font-size:10.5px;letter-spacing:.15em;color:#6f6a78;margin-bottom:7px}
.stat .v{font-family:var(--serif);font-size:27px;color:#f1eee6}
.stat .b{height:2px;background:#22212a;margin-top:9px;border-radius:2px;overflow:hidden}
.stat .b i{display:block;height:100%;background:#d3bb85}
#again{
  display:block;width:100%;margin-top:40px;padding:15px;border:1px solid #2f2c36;background:transparent;
  color:#d9d6de;font:inherit;font-size:13px;letter-spacing:.3em;border-radius:2px;cursor:pointer;transition:.3s;text-indent:.3em
}
#again:hover{background:#d9d6de;color:#07070a}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:60;
  background:#e9edf6;color:#0a0f1c;font-size:12.5px;padding:9px 18px;border-radius:22px;
  opacity:0;transition:.4s;pointer-events:none;font-weight:500;box-shadow:0 8px 30px #000a;white-space:nowrap
}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:480px){
  h1{font-size:46px}
  #text p{font-size:15.5px}
  #text p.big{font-size:21px;padding:.9em .2em}
  #scene{padding:6px 17px 0}
  #hud{padding:12px 14px 6px}
  .end-title{font-size:31px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body data-theme="night">

<div id="stage">
  <div id="hud">
    <span id="chap"></span>
    <span class="meters">
      <span class="meter z"><i></i></span>
      <span class="meter q"><i></i></span>
    </span>
    <button id="bagBtn">料 <b>0</b></button>
  </div>
  <div id="scene">
    <div id="kicker"></div>
    <div id="text"></div>
    <div id="choices"></div>
  </div>
  <div id="danmu"></div>
</div>

<div class="overlay" id="title">
  <div class="t-inner">
    <div class="t-sub">非官方同人 · 飞雪</div>
    <h1>不下车</h1>
    <div class="t-line">一个粉丝的二十年</div>
    <button id="startBtn">上车</button>
    <p class="t-note">
      本作为粉丝视角的虚构同人，取材于公开报道、节目内容与网络流传的说法。<br>
      文中人物是真实的公众人物；一切推测、CP 叙事与所谓的「真相」，都只属于叙事者的眼睛，不代表当事人的真实关系与事实。<br>
      请勿据此对真人求证、攻击或传播。她们只是唱过歌的人。
    </p>
  </div>
</div>

<div id="bag">
  <div class="bag-in">
    <div class="bag-hd"><h2>料</h2><button id="bagClose">合上</button></div>
    <div class="bag-sub" id="bagSub">你收集到的碎片。有的经得起查，有的只是别人想让你相信。</div>
    <div id="bagList"></div>
  </div>
</div>

<div id="endwrap"><div class="end-in" id="endIn"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ══════════════ 引擎 ══════════════ */
const $ = s => document.querySelector(s);
const bodyEl = document.body;
const textEl = $('#text'), choicesEl = $('#choices'), kickerEl = $('#kicker'),
      chapEl = $('#chap'), danmuEl = $('#danmu'), toastEl = $('#toast');

const S = { zhi: 0, qing: 0, money: 50, cai: [], f: {}, ch: '' };

/* 料库：v = 真 / 罗生门 / 未证实 / 无法证实 / 画面真·动机是读出来的 */
const CAI = {
  yashe:   { n:'鸭舌', v:'真', d:'厉娜递给许飞一袋鸭舌，许飞从此吃上瘾。', nt:'节目与早年采访都提过。' },
  bait:    { n:'白T恤', v:'真', d:'两人同住一间宿舍，厉娜爱干净，天天晾白T恤。', nt:'节目回忆段落。' },
  vote:    { n:'于公于私，于情于理', v:'真', d:'PK环节被问投票标准，厉娜说完这八个字，举起了许飞的手。', nt:'2006年播出画面，是这段关系最著名的镜头。' },
  rumour:  { n:'告密', v:'罗生门', d:'厉娜称，2007 年前后她把解约、跳槽、接私活的打算告诉了许飞，几天后消息传到天娱高层。', nt:'厉娜指控；许飞先否认「没有动机也没有能力」，后被追问时松口「可能说过，不止我一个人接私活」。没有录音，没有第三方证据。' },
  freeze:  { n:'七年空白', v:'真', d:'2007 年底到 2014 年，厉娜的行程单近乎全空，连收三封律师函，通告叫停。', nt:'公开行程可查。至于「因为谁」，各方说法不同。' },
  lace:    { n:'系鞋带', v:'画面真·动机是读出来的', d:'选车环节，许飞蹲在保姆车边反复系鞋带。', nt:'画面确实存在。但「鞋带没松、她在等厉娜」是网友逐帧读出来的，没有当事人确认。' },
  huadi:   { n:'画地为牢', v:'真', d:'「我是被宣判的人，我能去哪儿啊。我画地为牢。」', nt:'节目原话，海拔约四千米的悬崖小屋。' },
  mcd:     { n:'麦当劳', v:'真', d:'厉娜当场没接住那句话，回屋用AI查「画地为牢」什么意思，然后点了份麦当劳。', nt:'节目画面与本人回应。网友称之「深情与钝感的错位」。' },
  bus:     { n:'不下车', v:'真', d:'收官环节，四组人里只有这一组，双方都没有下车。', nt:'整季唯一一对。互道「感谢我的人生你曾出现过」。' },
  yuzheng: { n:'于正磕CP', v:'真', d:'编剧于正深夜发视频，说「我们给厉娜发的视频，磕生磕死的追」。', nt:'他还说厉娜看了也回了。' },
  recut:   { n:'重剪纯友情向', v:'未证实', d:'网传节目被举报，将重剪为「纯友情向」。', nt:'芒果TV与双方均未回应。' },
  tianya:  { n:'天涯千楼', v:'无法证实', d:'流传的2007年爆料原帖截图，据称跟了两千多楼。', nt:'原帖早已删除，流传的截图来源不明。你当年看到的那一版，可能根本不是最初那一版。' },
  crash:   { n:'服务器崩了', v:'真', d:'节目播出期间芒果TV被挤崩，有效播放破七亿。', nt:'云合综艺市占率一度接近六成。' },
};

const VCLASS = { '真':'v-true', '罗生门':'v-luo', '未证实':'v-unv', '无法证实':'v-unv', '画面真·动机是读出来的':'v-read' };

/* ── 主题 / HUD ── */
function setTheme(t){ if(t) bodyEl.dataset.theme = t; }
function setChap(t){ chapEl.textContent = t || ''; }
function refreshHUD(){
  document.querySelector('.meter.z i').style.width = Math.min(100, S.zhi/22*100) + '%';
  document.querySelector('.meter.q i').style.width = Math.min(100, S.qing/22*100) + '%';

function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>toastEl.classList.remove('on'), 1700);
}
function addCai(k){
  if(S.cai.includes(k)) return;
  S.cai.push(k); refreshHUD(); toast('＋ 料：' + CAI[k].n);
}

/* ── 打字机 ── */
let queue = [], cur = null, curIdx = 0, timer = null, busy = false, doneCb = null;

function makePara(p){
  const el = document.createElement('p');
  let txt = '';
  if (typeof p === 'string'){ el.className='nar'; txt = p; }
  else if (p.w){ el.className='dia'; const s=document.createElement('span'); s.className='who'; s.textContent=p.w; el.appendChild(s); txt=p.t; }
  else if (p.big){ el.className='big'; txt=p.big; }
  else if (p.note){ el.className='note'; txt=p.note; }
  else if (p.bbs){ el.className='bbs'; txt=p.bbs; }
  else if (p.sys){ el.className='sys'; txt=p.sys; }
  else { el.className='nar'; txt=p.t || ''; }
  const tn = document.createTextNode('');
  el.appendChild(tn);
  return { el, tn, txt };
}

function playParas(paras, cb){
  $('#scene').classList.add('tap');
  queue = (paras || []).slice();
  doneCb = cb || null;
  busy = true;
  textEl.innerHTML = '';
  choicesEl.innerHTML = '';
  step();
}
function step(){
  if (!queue.length){
    busy = false;
    const f = doneCb; doneCb = null;
    if (f) f();
    return;
  }
  const p = queue.shift();
  cur = makePara(p);
  curIdx = 0;
  textEl.appendChild(cur.el);
  type();
}
function type(){
  if (curIdx >= cur.txt.length){ finishPara(); return; }
  const step2 = cur.txt[curIdx] === '。' || cur.txt[curIdx] === '，' ? 55 : 26;
  cur.tn.textContent += cur.txt[curIdx++];
  scrollBottom();
  timer = setTimeout(type, step2);
}
function finishPara(){
  clearTimeout(timer);
  cur.tn.textContent = cur.txt;
  scrollBottom();
  timer = setTimeout(step, 190);
}
function skipAll(){
  if (!busy) return;
  clearTimeout(timer);
  if (cur) cur.tn.textContent = cur.txt;
  while (queue.length){
    const o = makePara(queue.shift());
    o.tn.textContent = o.txt;
    textEl.appendChild(o.el);
  }
  busy = false;
  scrollBottom();
  const f = doneCb; doneCb = null;
  if (f) f();
}
function scrollBottom(){ textEl.scrollTop = textEl.scrollHeight; }

/* ── 选项 ── */
function showChoices(list){
  $('#scene').classList.remove('tap');
  choicesEl.innerHTML = '';
  list.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice' + (c.cont ? ' cont' : '');
    b.style.animationDelay = (i*70) + 'ms';
    b.innerHTML = '<span class="ct"></span>' + (c.sub ? '<span class="cs"></span>' : '');
    b.querySelector('.ct').textContent = c.t;
    if (c.sub) b.querySelector('.cs').textContent = c.sub;
    b.onclick = () => {
      if (c.fx) applyFx(c.fx);
      choicesEl.innerHTML = '';
      if (c.go) goto(c.go);
      else if (c.do) c.do();
    };
    choicesEl.appendChild(b);
  });
}
function applyFx(fx){
  if (fx.z) { S.zhi += fx.z; }
  if (fx.q) { S.qing += fx.q; }
  if (fx.money) { S.money += fx.money; }
  if (fx.cai) { [].concat(fx.cai).forEach(addCai); }
  if (fx.flag) { Object.assign(S.f, fx.flag); }
  refreshHUD();
}

/* ── 主流程 ── */
function goto(id){
  if (id === '__end'){ doEnding(); return; }
  const n = NODES[id];
  if (!n){ doEnding(); return; }
  setTheme(n.theme);
  setChap(n.ch);
  if (n.kicker !== undefined) kickerEl.textContent = n.kicker;
  if (n.enter) n.enter();
  playParas(n.text, () => {
    if (n.special){ runSpecial(n.special, n); return; }
    if (n.choices) { showChoices(n.choices); return; }
    if (n.next){ showChoices([{ t: n.nextLabel || '继续', go: n.next, cont: true }]); return; }
    if (n.end){ doEnding(); }
  });
}

/* ── 小游戏 2：盯住鞋带 ── */
function runLace(node){
  choicesEl.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'mini';
  box.innerHTML =
    '<div class="lbl">选车环节 · 现场</div>' +
    '<div class="track"><i></i></div>' +
    '<button class="btn hold">按住 · 别移开视线</button>' +
    '<button class="btn ghost away">松开 · 看向别处</button>' +
    '<div class="ticks"></div>';
  choicesEl.appendChild(box);

  const fill = box.querySelector('.track i'),
        ticks = box.querySelector('.ticks'),
        hold = box.querySelector('.hold');
  let p = 0, raf = null, holding = false, done = false;

  const msgs = [
    [18, '她蹲在车门边上。左手扶着车漆，右手在鞋面上。'],
    [40, '鞋带是系好的。你反复看了三遍，是系好的。'],
    [62, '她解开，又系上。这是第二次。'],
    [82, '第三次。她抬头看了一眼另一辆车的方向。'],
    [100, '第四次。她终于站起来，上了那辆车。\n鞋带，一次都没有松过。'],
  ];
  let shown = 0;

  function frame(){
    if (!holding) return;
    p = Math.min(100, p + 0.62);
    fill.style.width = p + '%';
    while (shown < msgs.length && p >= msgs[shown][0]){
      const d = document.createElement('div');
      d.innerHTML = '<b>' + msgs[shown][1].replace(/\n/g,'</b><br><b>') + '</b>';
      ticks.appendChild(d);
      shown++;
    }
    if (p >= 100){ end(true); return; }
    raf = requestAnimationFrame(frame);
  }
  function end(hit){
    if (done) return;
    done = true; holding = false;
    cancelAnimationFrame(raf);
    hold.disabled = true; box.querySelector('.away').disabled = true;
    if (hit){
      addCai('lace'); S.zhi += 3; S.qing += 1; refreshHUD();
    } else {
      ticks.innerHTML = '<div><b>你移开了视线。等你再看回去，她已经上车了。</b></div>';
      S.qing += 2; refreshHUD();
    }
    const b = document.createElement('button');
    b.className = 'choice';
    b.style.marginTop = '12px';
    b.innerHTML = '<span class="ct">继续</span>';
    b.onclick = () => goto('c6_c');
    choicesEl.appendChild(b);
  }
  hold.addEventListener('pointerdown', e => { e.preventDefault(); if(done) return; holding = true; frame(); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev =>
    hold.addEventListener(ev, () => { if (holding && !done){ holding = false; cancelAnimationFrame(raf); end(false); } })
  );
  box.querySelector('.away').onclick = () => end(false);
}

/* ── 小游戏 3：不下车 ── */
function runBus(node){
  choicesEl.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'mini';
  box.innerHTML =
    '<div class="lbl">第 18 天 · 终点站</div>' +
    '<div class="track"><i></i></div>' +
    '<button class="btn hold">按住 · 喊出来</button>' +
    '<button class="btn ghost away">松开 · 什么都不做</button>' +
    '<div class="ticks"></div>';
  choicesEl.appendChild(box);

  const fill = box.querySelector('.track i'), ticks = box.querySelector('.ticks'),
        hold = box.querySelector('.hold');
  let p = 0, raf = null, holding = false, done = false;
  const msgs = [
    [22, '车门开着。风灌进来，很冷。'],
    [48, '你在站台上。你什么都做不了。'],
    [72, '你想起二十年前，你在电视机前打翻了一碗泡面。'],
    [100, '你的喉咙里有一个名字。它没有出来。'],
  ];
  let shown = 0;
  function frame(){
    if (!holding) return;
    p = Math.min(100, p + 0.8);
    fill.style.width = p + '%';
    while (shown < msgs.length && p >= msgs[shown][0]){
      const d = document.createElement('div'); d.innerHTML = '<b>'+msgs[shown][1]+'</b>';
      ticks.appendChild(d); shown++;
    }
    if (p >= 100){ end('shout'); return; }
    raf = requestAnimationFrame(frame);
  }
  function end(kind){
    if (done) return;
    done = true; holding = false;
    cancelAnimationFrame(raf);
    hold.disabled = true; box.querySelector('.away').disabled = true;
    if (kind === 'shout'){ S.zhi += 3; ticks.innerHTML = '<div><b>你喊了。车厢里没有人回头。</b></div>'; }
    else { S.qing += 3; ticks.innerHTML = '<div><b>你松开了手。车门关上的声音很轻。</b></div>'; }
    refreshHUD();
    const b = document.createElement('button');
    b.className = 'choice'; b.style.marginTop = '12px';
    b.innerHTML = '<span class="ct">继续</span>';
    b.onclick = () => goto('c6_g');
    choicesEl.appendChild(b);
  }
  hold.addEventListener('pointerdown', e => { e.preventDefault(); if(done) return; holding = true; frame(); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev =>
    hold.addEventListener(ev, () => { if (holding && !done){ holding = false; cancelAnimationFrame(raf); end('letgo'); } })
  );
  box.querySelector('.away').onclick = () => end('letgo');
}

function runFeed(node){
  let picked = 0;
  choicesEl.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'cards';
  choicesEl.appendChild(wrap);

  FEED.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.style.animationDelay = (i*60) + 'ms';
    el.innerHTML = '<div class="src"></div><div class="ttl"></div><div class="meta"><span></span><span class="save">收藏</span></div>';
    el.querySelector('.src').textContent = c.src;
    el.querySelector('.ttl').textContent = c.ttl;
    el.querySelector('.meta span').textContent = c.meta;
    el.onclick = () => {
      if (el.classList.contains('on')) return;
      el.classList.add('on');
      el.querySelector('.save').textContent = '已收藏';
      addCai(c.k);
      if (c.k === 'recut' || c.k === 'tianya') S.qing += 1; else S.zhi += 1;
      refreshHUD();
      picked++;
      if (picked >= 3) showNext();
    };
    wrap.appendChild(el);
  });

  function showNext(){
    if (wrap.nextElementSibling) return;
    const b = document.createElement('button');
    b.className = 'choice'; b.style.marginTop = '4px';
    b.innerHTML = '<span class="ct">划走</span><span class="cs">你已经收藏了 '+picked+' 条</span>';
    b.onclick = () => goto('c5_b');
    choicesEl.appendChild(b);
    setTimeout(()=>{ choicesEl.scrollTop = choicesEl.scrollHeight; }, 60);
  }
}

function runSpecial(kind, node){
  if (kind === 'vote') runVote(node);
  if (kind === 'lace') runLace(node);
  if (kind === 'bus')  runBus(node);
  if (kind === 'feed') runFeed(node);
}

  bagOpen = true; $('#bag').classList.add('on'); renderBag();

  const L = $('#bagList');
  if (!S.cai.length){ L.innerHTML = '<div class="empty">还什么都没有。<br>料是一点一点攒出来的。</div>'; return; }
  L.innerHTML = '';
  S.cai.forEach(k => {
    const c = CAI[k];
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = '<div class="n"><span></span><span class="chip '+(VCLASS[c.v]||'v-unv')+'"></span></div><div class="d"></div>' + (c.nt ? '<div class="nt"></div>' : '');
    d.querySelector('.n span').textContent = c.n;
    d.querySelector('.chip').textContent = c.v;
    d.querySelector('.d').textContent = c.d;
    if (c.nt) d.querySelector('.nt').textContent = c.nt;
    L.appendChild(d);
  });
}
